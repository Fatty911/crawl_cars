# crawl_cars — CNB 流水线：push CI+AI 自修复 / 半月增量爬取
# 增量闭环：爬取→合并→保留基线→产物与断点提交回本仓，下轮 checkout 基于上轮基线续爬合并
# 代理：PROXY_SUBSCRIPTIONS 走 CNB 仓库环境变量（设置→环境变量），缺失即失败，禁止直连裸爬
# 模型: deepseek-v4.1-flash（修复）+ glm-5.3-flash（只读交叉审查）

main:
  push:
    - docker:
        image: python:3.11
      env:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
      stages:
        - name: install-deps
          script: |
            python -m pip install --disable-pip-version-check -r requirements.txt || true
            # pytest 是 push CI 测试闸的执行器，多数仓 requirements.txt 未声明它；
            # 缺失时 `python -m pytest` 直接 127，push 流水线从未真正跑过测试。
            python -m pytest --version >/dev/null 2>&1 || python -m pip install --disable-pip-version-check pytest
            if ! command -v node >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs npm
            fi
            node --version
        - name: 推送代码到GitLab
          script: |
            # 令牌缺失时显式跳过（该仓 CNB 环境变量未配 GITLAB_TOKEN 时不得把整条 push CI 打红）
            if [ -z "$GITLAB_TOKEN" ]; then
              echo "未配置 GITLAB_TOKEN：跳过 GitLab 镜像同步"
              exit 0
            fi
            # token 不入 URL/进程表：走 GIT_ASKPASS
            cat > /tmp/gl-askpass.sh <<'AASK'
            #!/bin/sh
            case "$1" in
              *sername*) echo "oauth2" ;;
              *) printf '%s' "$GITLAB_TOKEN" ;;
            esac
            AASK
            chmod +x /tmp/gl-askpass.sh
            git remote remove gitlab 2>/dev/null || true
            git remote add gitlab https://gitlab.com/xuerui911/crawl_cars.git
            if GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main --force-with-lease 2>&1 \
                || GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main 2>&1; then
              echo "GITLAB_PUSH=done"
              echo "GITLAB_PUSH=done" >> _stage_context_.env
            else
              echo "⚠️ GitLab 镜像推送失败（多端镜像非必需，不阻断主流水线；令牌无效或过期请重新签发）"
              echo "GITLAB_PUSH=failed" >> _stage_context_.env
            fi
            rm -f /tmp/gl-askpass.sh
        - name: pytest
          script: |
            # PIPESTATUS 是 bash 数组，CNB runner 用 sh(dash) 执行 stage 脚本会 Bad substitution(127)。
            # POSIX 取法：子 shell 内把真实退出码落盘，`| tee` 保持 stdout 实时回显——
            # 直接重定向会让 stdout 静默，触发 CNB「10 分钟无输出强杀」（vps 仓已实证）。
            rm -f _pytest_rc_.txt
            ( set +e; python -m pytest tests/ -x --tb=short 2>&1; echo $? > _pytest_rc_.txt ) | tee _test_result_.txt
            rc=$(cat _pytest_rc_.txt)
            echo "PYTEST_EXIT=$rc" >> _stage_context_.env
            # 此前退出码取 tee 的 0，测试失败从不使流水线变红（结构性假绿），现诚实穿透
            exit "$rc"
        - name: 语法校验
          script: |
            if python -m py_compile scripts/*.py; then
              echo "SYNTAX=PASS" >> _stage_context_.env
            else
              echo "SYNTAX=FAIL" >> _stage_context_.env
              echo "❌ SYNTAX 未通过：原写法 A && echo PASS || echo FAIL 的退出码恒为 0，属结构性假绿，现改为硬失败"
              exit 1
            fi
        - name: 治理校验
          script: |
            python scripts/validate_workflow_expectations.py || echo "WARN: workflow expectations 未通过"
            python scripts/validate_plan_agent_boundary.py || echo "WARN: plan/agent 边界未通过"
            python scripts/scan_direct_llm_calls.py scripts .github || echo "WARN: 存在 LLM 直调"
  api_trigger:
    # 半月增量爬取（每月 1/16 日 08:05 Asia/Shanghai，落在人类作息窗口 08:00-12:30 内；对齐负责人半月增量本意，撤销 09-20 移植期错峰 5/20）
    # 汽车之家/懂车帝走 --incremental 只爬新增车系；易车不带 GitHub 时代 artifact 断点恢复（CNB 无 artifact）
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      # CNB Job 无输出默认 10min 即强杀；爬虫按窗口预算最长可跑 ~5.25h（08:05 触发，
      # 易车 10800s + 汽车之家/懂车帝各 2700s×3）加合并发布，10h 覆盖最坏情况
      timeout: 10h
      stages:
        - name: 检查代理配置
          script: |
            if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
              echo "❌ 未注入 PROXY_SUBSCRIPTIONS：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。防反爬必须走 Mihomo 代理。"
              exit 1
            fi
        - name: install-deps
          script: python -m pip install -r requirements.txt
        - name: 安装浏览器
          script: |
            # test_autohome.py 第四步与 crawl_dongchedi.py 依赖 Chrome/chromedriver（GitHub 侧用 setup-chrome@v2 + setup-chromedriver@v2）
            set -e
            if command -v chromedriver >/dev/null 2>&1; then
              chromedriver --version
              exit 0
            fi
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends chromium chromium-driver
            chromedriver --version
        - name: 启动Mihomo代理
          script: |
            set -e
            # 本仓 setup_proxy_runtime.py 只支持 --github-env（无 --require-proxy/--clear），且代理失败会降级直连，故显式硬校验
            : > /tmp/proxy.env
            # 调优（2026-10-07）：~100s 失败根因=代理订阅/mihomo 启动/测试单点，网络间歇抖动
            # 加 3 次重试 + 进度输出（防 CNB 10 分钟无输出强杀）
            OK=0
            for ATTEMPT in 1 2 3; do
              echo "[proxy] attempt $ATTEMPT/3 $(date -u +%H:%M:%S)"
              : > /tmp/proxy.env
              if python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --test-url https://www.autohome.com.cn; then
                OK=1; break
              fi
              echo "[proxy] attempt $ATTEMPT failed, retry in 15s"
              sleep 15
            done
            if [ "$OK" != "1" ]; then
              echo "FAIL_STAGE=启动Mihomo代理 reason=3-attempts-exhausted"; exit 1
            fi
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
            . /tmp/proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ]; then
              echo "❌ 代理未启用（PROXY_ENABLED!=true），防反爬要求禁止直连裸爬，终止本轮"
              exit 1
            fi
            printf 'export CHROME_PROXY_SERVER=http://127.0.0.1:7890\n' >> /tmp/proxy.sh
            . /tmp/proxy.sh
            echo "代理就绪：$HTTP_PROXY"
        - name: 获取线上发布基线
          timeout: 1h
          script: |
            set -e
            # 只使用最新完整 immutable CNB Release；下载或校验失败即中止，不退回仓内旧 docs/旧 Pages/空数据。
            rm -rf /tmp/cnb-verified-baseline-assets /tmp/cnb-verified-baseline-site
            python scripts/download_verified_release.py --repo Fatty911/crawl_cars --no-legacy --dir /tmp/cnb-verified-baseline-assets
            python scripts/prepare_cnb_pages.py --archive /tmp/cnb-verified-baseline-assets/verified-site.zip --manifest /tmp/cnb-verified-baseline-assets/manifest.json --site /tmp/cnb-verified-baseline-site
            python - <<'PY'
            import json, shutil
            from pathlib import Path
            site = Path("/tmp/cnb-verified-baseline-site")
            manifest = json.loads((site / "data/manifest.json").read_text(encoding="utf-8"))
            source = site / manifest["files"]["latestJson"]
            if not source.resolve().is_relative_to(site.resolve()):
                raise ValueError("baseline path escapes verified site")
            payload = json.loads(source.read_text(encoding="utf-8"))
            if not isinstance(payload, list):
                raise ValueError("verified baseline must be an array")
            rows = payload
            if len(rows) < 10000:
                raise ValueError(f"verified baseline incomplete: {len(rows)} rows < 10000")
            target = Path("/tmp/cnb-baseline/latest.json")
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(source, target)
            print(f"verified immutable baseline: {len(rows)} rows -> {target}")
            PY
        - name: 分配爬取时间预算
          script: |
            set -e
            # CNB 有 120min 流水线硬上限（日志明示 maximum pipeline duration is exceeded: 120min），
            # 超时整条构建被杀 —— 本轮无论爬到哪一步都拿不到产物，Pages 只能停在上一轮日期。
            # GitHub Actions 时代各源 --time-limit 各自独立（汽车之家/懂车帝各 2700s、
            # 易车最长 21000s），相加远超 CNB 上限，等于「每源留足预算 = 每源都被腰斩」。
            # 这里按权重把总预算切给各爬取步，env 落盘供后续 stage source。
            # 旧的 MR/BN_MR/TB 等死变量已删除：代码里没有任何 os.getenv 读它们（已全仓核查）。
            python scripts/allocate_crawl_budget.py \
              --output /tmp/cnb-crawl-budget.env \
              --elapsed-seconds "$(python scripts/pipeline_elapsed_seconds.py)"
            cat /tmp/cnb-crawl-budget.env
        - name: 爬取-汽车之家
          timeout: 1h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$AUTOHOME_STEP1_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            # step1 的 --time-limit 从「硬编码 2700」改为读预算分配器：
            # DEBUG_MODE 时为 480s（能跑通全链并刷新 Pages 日期），
            # 生产时按权重从 120min 上限里切，且与懂车帝/易车共享同一总预算。
            # max-cars 同理：DEBUG 时限 20 个车系、跳过全量历史发现，否则 0=不限制。
            AH_MAX_CARS=0
            if [ "${DEBUG_MODE:-false}" = "true" ]; then AH_MAX_CARS=20; fi
            echo "汽车之家预算: step1 time-limit=${AUTOHOME_STEP1_TIME_LIMIT}s max-cars=${AH_MAX_CARS} debug=${CRAWL_BUDGET_DEBUG}"
            # 输出落盘 + 尾部回显 + 保留退出码：失败时由 failStages 收集尾部日志供诊断
            rc=0
            python scripts/test_autohome.py --step 1 --auto \
              --time-limit "$AUTOHOME_STEP1_TIME_LIMIT" --max-cars "$AH_MAX_CARS" --incremental \
              > /tmp/autohome-step1.log 2>&1 || rc=$?
            tail -n 20 /tmp/autohome-step1.log
            if [ $rc -eq 0 ]; then echo "汽车之家 step1 完成"
            elif [ $rc -eq 10 ]; then echo "汽车之家 step1 预算到点收尾（设计内，进度已保存）"
            else echo "汽车之家 step1 失败 rc=$rc，继续后续步骤"; fi
            for s in 2 3 4 5 6; do
              python scripts/test_autohome.py --step $s || echo "汽车之家 step$s 失败，继续"
            done
        - name: 归一化汽车之家产物路径
          script: |
            # test_autohome.py:1871 写 scripts/，merge_data.py 只在仓根 glob；对齐 GitHub crawl-autohome.yml:428-438
            # POSIX 版：09-30 实测 bash 数组/nullglob 写法在增量零产出场景下使本 stage error（12:07/13:59 两轮），
            # 改 find+cp，任何 shell、任何产物状态都不阻断；产物有无由下游合并的 nullglob 容错自然处理
            find scripts -maxdepth 1 -name 'autoHome_*.json' -exec cp -pf {} . \; || true
            find scripts -maxdepth 1 -name 'autoHome_*.csv' -exec cp -pf {} . \; || true
            ls -l autoHome_*.json autoHome_*.csv 2>/dev/null || echo "仓根无 autoHome_* 产物（零产出或增量无新增，继续）"
            exit 0
        - name: 爬取-懂车帝
          timeout: 2h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$DONGCHEDI_STEP1_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            # crawl_dongchedi.py:17 依赖仓根在 sys.path（GitHub crawl-dongchedi.yml:41 的 PYTHONPATH）
            export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
            # debug_mode（对齐 GitHub workflow_dispatch inputs.debug_mode）：
            # DEBUG_MODE=true 强制小批量，过作息窗口也能跑通全链并刷新 Pages 日期。
            # 真正的 debug 开关是 --debug-limit（crawl_dongchedi.py:80，据此设 MAX_SERIES_PER_RUN
            # 并强制 INCREMENTAL_MODE），不是下面删掉的那批变量。
            DCD_DEBUG_ARGS=""
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              DCD_DEBUG_ARGS="--debug-limit 20"
            fi
            echo "懂车帝预算: step1=${DONGCHEDI_STEP1_TIME_LIMIT}s step2=${DONGCHEDI_STEP2_TIME_LIMIT}s debug=${CRAWL_BUDGET_DEBUG} args='${DCD_DEBUG_ARGS}'"
            # 输出落盘 + 尾部回显 + 保留退出码：失败时由 failStages 收集尾部日志供诊断
            rc=0
            # shellcheck disable=SC2086  # DCD_DEBUG_ARGS 需按两个词拆开
            timeout --signal=TERM --kill-after=15s "$((DONGCHEDI_STEP1_TIME_LIMIT + 30))s" python scripts/crawl_dongchedi.py --step 1 --auto \
              --time-limit "$DONGCHEDI_STEP1_TIME_LIMIT" $DCD_DEBUG_ARGS \
              > /tmp/dongchedi-step1.log 2>&1 || rc=$?
            tail -n 20 /tmp/dongchedi-step1.log
            if [ $rc -eq 0 ]; then echo "懂车帝 step1 完成"
            elif [ $rc -eq 10 ]; then echo "懂车帝 step1 预算到点收尾（设计内，进度已保存）"
            else echo "懂车帝 step1 失败 rc=$rc，继续后续步骤"; fi
            rc=0
            # shellcheck disable=SC2086  # DCD_DEBUG_ARGS 需按两个词拆开
            timeout --signal=TERM --kill-after=15s "$((DONGCHEDI_STEP2_TIME_LIMIT + 30))s" python scripts/crawl_dongchedi.py --step 2 --auto \
              --time-limit "$DONGCHEDI_STEP2_TIME_LIMIT" --max-series 0 --incremental $DCD_DEBUG_ARGS \
              > /tmp/dongchedi-step2.log 2>&1 || rc=$?
            tail -n 20 /tmp/dongchedi-step2.log
            if [ $rc -eq 0 ]; then echo "懂车帝 step2 完成"
            elif [ $rc -eq 10 ]; then echo "懂车帝 step2 预算到点收尾（设计内，进度已保存）"
            else echo "懂车帝 step2 失败 rc=$rc，继续"; fi
            # 到点保存的配置也要解析成源产物，才能进入本轮增量合并。
            python scripts/crawl_dongchedi.py --step 3 || echo "懂车帝本轮无可解析配置，保留基线"
            python scripts/crawl_dongchedi.py --step 4 || echo "懂车帝本轮无新产物，保留基线"
        - name: 归一化懂车帝产物路径
          script: |
            # crawl_dongchedi.py 写 scripts/，merge_data.py 只在仓根 glob；对齐 GitHub crawl-dongchedi.yml
            # POSIX 版（对齐「归一化汽车之家产物路径」09-30 修复）：shopt/bash 数组在 sh(dash) 下
            # 直接语法错误或 127，改 find+cp，任何 shell、任何产物状态都不阻断
            find scripts -maxdepth 1 -name 'dongchedi_*.json' -exec cp -pf {} . \; || true
            find scripts -maxdepth 1 -name 'dongchedi_*.csv' -exec cp -pf {} . \; || true
            ls -l dongchedi_*.json dongchedi_*.csv 2>/dev/null || echo "仓根无 dongchedi_* 产物（零产出或增量无新增，继续）"
            exit 0
        - name: 爬取-易车
          timeout: 6h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$YICHE_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            YICHE_STARTED=$(date +%s)
            # 预算必须同时受两个上限约束，取更严的那个：
            #   ① 作息窗口（GitHub 原设计 morning 10800 / afternoon 21000，北京时间
            #      08:00-12:30 与 13:00-22:00，窗口末留 900s安全缓冲）——
            #      这是「什么时候爬」的人为约束；
            #   ② CNB 流水线 120min 硬上限 —— 这是「最多能爬多久」的物理约束。
            # 移植到 CNB 后 configure 被裸调、RUN_TIME 从未落地，退化成硬编码 2700；
            # 现在窗口值由 configure 给出并写盘，且被分配器的 YICHE_TIME_LIMIT 钳制。
            python scripts/crawl_budget.py configure --github-env /tmp/cnb-yiche-window.env --github-output /tmp/cnb-yiche-window.out || true
            [ -f /tmp/cnb-yiche-window.env ] && . /tmp/cnb-yiche-window.env
            WINDOW_RUN_TIME="${RUN_TIME:-0}"
            if [ "$WINDOW_RUN_TIME" -le 0 ]; then
              # 窗口外：窗口预算为 0，此时只受分配器约束（分配器已扣掉发布阶段开销）
              RUN_TIME="$YICHE_TIME_LIMIT"
              echo "易车预算: 窗口外，取分配器预算 RUN_TIME=${RUN_TIME}s"
            elif [ "$WINDOW_RUN_TIME" -lt "$YICHE_TIME_LIMIT" ]; then
              RUN_TIME="$WINDOW_RUN_TIME"
              echo "易车预算: 取窗口预算 RUN_TIME=${RUN_TIME}s（窗口 08:00-12:30 / 13:00-22:00, 缓冲 900s）"
            else
              RUN_TIME="$YICHE_TIME_LIMIT"
              echo "易车预算: 窗口给出 ${WINDOW_RUN_TIME}s 但 120min 上限只允许 ${RUN_TIME}s，取后者"
            fi
            # 断点必须落在 crawl_state/：既被「回推增量状态」的 git add 覆盖（跨轮累积），
            # 又不匹配 merge 的 yiche_*.json glob（不污染合并）。
            mkdir -p crawl_state
            export YICHE_CHECKPOINT_PATH=crawl_state/yiche_frontier.json
            # POSIX 版：bash 数组在 sh(dash) 下语法错误，改用 set --/"$@" 收集续跑参数
            set --
            if [ -s "$YICHE_CHECKPOINT_PATH" ]; then
              set -- "$@" \
                --resume-checkpoint "$YICHE_CHECKPOINT_PATH" \
                --resume-source-run-id "" \
                --resume-source-artifact-id "" \
                --resume-source-artifact-sha256 "" \
                --resume-source-checkpoint-sha256 "$(sha256sum "$YICHE_CHECKPOINT_PATH" | cut -d' ' -f1)" \
                --resume-source-head-sha "" \
                --resume-source-crawler-sha256 "$(sha256sum scripts/crawl_yiche.py | cut -d' ' -f1)"
              brands_remaining=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('remaining_brands', '?'))" "$YICHE_CHECKPOINT_PATH" 2>/dev/null || echo '?')
              echo "易车续跑：基于上一轮断点 $YICHE_CHECKPOINT_PATH (brands_remaining=$brands_remaining)"
            else
              echo "易车首轮：无断点，按全量发现起始"
            fi
            # DEBUG 模式限量车系数，与懂车帝 --debug-limit 同一语义（限的是工作量，不是时间）
            YICHE_EXTRA_ARGS=""
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              YICHE_EXTRA_ARGS="--max-series 20"
            fi
            rc=0
            # shellcheck disable=SC2086  # YICHE_EXTRA_ARGS 需按两个词拆开
            python scripts/crawl_yiche.py --time-limit "$RUN_TIME" --max-series 0 \
              "$@" $YICHE_EXTRA_ARGS --output "yiche_$(date +%Y%m%d).json" \
              > /tmp/yiche-main.log 2>&1 || rc=$?
            tail -n 20 /tmp/yiche-main.log
            if [ $rc -eq 0 ]; then echo "易车 单源失败 rc=$rc，继续 完成"
            elif [ $rc -eq 10 ]; then echo "易车 单源失败 rc=$rc，继续 预算到点收尾（设计内，进度已保存）"
            else echo "易车 单源失败 rc=$rc，继续"; fi
            cp /tmp/yiche-main.log crawl_state/yiche-last-run.log 2>/dev/null || true
            # 续跑被判定不兼容时会一行不产；退回首轮，保证本轮仍有易车数据可合并。
            # 重爬预算必须再砍半：它是在主爬已经花掉 RUN_TIME 之后追加的，
            # 不砍半就会把「分配器算好的总额」直接吃掉，合并阶段被腰斩。
            YICHE_REMAINING=$((RUN_TIME - $(date +%s) + YICHE_STARTED))
            if [ ! -s "yiche_$(date +%Y%m%d).json" ] && [ "$YICHE_REMAINING" -gt 0 ]; then
              echo "⚠️ 易车本轮无产出，退回首轮重爬"
              rm -f "$YICHE_CHECKPOINT_PATH"
              python scripts/crawl_yiche.py --time-limit "$YICHE_REMAINING" --max-series 0 \
                --output "yiche_$(date +%Y%m%d).json" \
                || echo "易车 重爬仍失败，继续"
            fi
        - name: 清理代理进程
          script: pkill -x mihomo || true
        - name: 合并-增量保留基线
          timeout: 30m
          script: |
            set -e
            DATE=$(date +%Y%m%d)
            BASELINE=/tmp/cnb-baseline/latest.json
            # 跨阶段共用同一日期键，避免 merge_data.py 与发布阶段在 UTC/本地跨零点时取到不同日期
            echo "export MERGE_DATE=$DATE" > /tmp/cnb-date
            export MERGE_DATE=$DATE
            # crawl_yiche 的断点文件同名匹配 yiche_*.json，而 merge_data.py:2388 find_latest 取 mtime 最新者；
            # 断点是 dict 而非行数组，被选中会污染或炸合并，先移出 glob 视野
            mkdir -p /tmp/cnb-checkpoints
            for f in yiche_checkpoint.json yiche_progress.json; do
              [ -f "$f" ] && mv -f "$f" /tmp/cnb-checkpoints/ || true
            done
            # POSIX 版：shopt 是 bash 内建，CNB runner 用 sh(dash) 执行会 127 挂掉（phones 实证）
            # 用循环收集存在的文件模拟 nullglob，零产出时 $# 仍为 0
            set --
            for f in autoHome_*.json dongchedi_*.json yiche_*.json; do
              [ -f "$f" ] && set -- "$@" "$f"
            done
            [ $# -gt 0 ] || { echo "❌ 三个源均无数据文件，无法合并"; exit 1; }
            python scripts/merge_data.py
            [ -s "merged_${DATE}.json" ] || { echo "❌ merge_data.py 未产出 merged_${DATE}.json"; exit 1; }
            python scripts/preserve_publish_baseline.py \
              --baseline "$BASELINE" \
              --merged-json "merged_${DATE}.json" \
              --merged-csv "merged_${DATE}.csv" \
              --filtered-json "filtered_cars_${DATE}.json" \
              --filtered-csv "filtered_cars_${DATE}.csv"
            python scripts/verify_publish_superset.py \
              --baseline "$BASELINE" \
              --candidate "merged_${DATE}.json"
        - name: 组装发布站点
          timeout: 30m
          script: |
            set -e
            . /tmp/cnb-date
            DATE=$MERGE_DATE
            BASELINE=/tmp/cnb-baseline/latest.json
            ROWS=$(python -c "import json; print(len(json.load(open('merged_${DATE}.json', encoding='utf-8'))))")
            if [ "$ROWS" -lt 1000 ]; then
              echo "❌ 合并数据少于 1000 行（当前 $ROWS），疑似爬取不完整，拒绝发布"
              exit 1
            fi
            # 对齐 GitHub merge-and-filter.yml:736-739,830-877：site/ 每次重建，时间戳文件不在仓内累积
            rm -rf site
            mkdir -p site/data site/config
            cp -R docs/. site/
            cp config/filter_conditions.json site/config/filter_conditions.json
            cp "merged_${DATE}.json" site/data/latest.json
            cp "filtered_cars_${DATE}.json" site/data/filtered.json
            # 报价已由独立链路（crontab: 37 8 * * 0）刷新，
            # 这里必须开 --refresh-dealer-prices，否则陈旧报价不会被更新
            python scripts/prepare_pages_payload.py --input site/data/latest.json --output site/data/latest.json --min-year 2022 --refresh-dealer-prices
            python scripts/prepare_pages_payload.py --input site/data/filtered.json --output site/data/filtered.json --min-year 2022
            python scripts/audit_pages_payload.py \
              --baseline "$BASELINE" \
              --candidate site/data/latest.json \
              --report pages-audit-report.json \
              --head-sha "$CNB_COMMIT"
            cp "merged_${DATE}.csv" "site/data/merged_${DATE}.csv"
            cp "filtered_cars_${DATE}.csv" "site/data/filtered_cars_${DATE}.csv"
            python - "$DATE" <<'PY'
            import json
            import shutil
            import sys
            from datetime import datetime, timezone

            date = sys.argv[1]
            with open("site/data/latest.json", encoding="utf-8") as f:
                latest = json.load(f)
            with open("site/data/filtered.json", encoding="utf-8") as f:
                filtered = json.load(f)
            stamp = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
            shutil.copy("site/data/latest.json", f"site/data/latest_{stamp}.json")
            shutil.copy("site/data/filtered.json", f"site/data/filtered_{stamp}.json")
            manifest = {
                "date": date,
                "updatedAt": datetime.now(timezone.utc).isoformat(),
                "rowCount": len(latest),
                "filteredRowCount": len(filtered),
                "files": {
                    "latestJson": f"data/latest_{stamp}.json",
                    "filteredJson": f"data/filtered_{stamp}.json",
                    "latestCsv": f"data/merged_{date}.csv",
                    "filteredCsv": f"data/filtered_cars_{date}.csv",
                },
            }
            with open("site/data/manifest.json", "w", encoding="utf-8") as f:
                json.dump(manifest, f, ensure_ascii=False, indent=2)
            print(manifest)
            PY
            touch site/.nojekyll
            mkdir -p docs/analysis
            python scripts/analysis/merge_evidence_report.py --input "merged_${DATE}.json" --output docs/analysis/merge_evidence_report.json || true
            python scripts/crawl_zero_to_whole_ratio.py || true
        - name: 验证渲染数据
          timeout: 30m
          image: node:22
          script: node scripts/verify_pages_rendered_data.js site/data/latest.json
        - name: 推送数据到GitHub Release
          timeout: 25m
          script: |
            set -e
            python scripts/publish_github_release.py --site-dir site --repo Fatty911/crawl_cars --workflow cnb-pages.yml
        - name: 组装Cloudflare完整分片
          timeout: 20m
          script: |
            set -e
            rm -rf cf-site
            python scripts/prepare_cloudflare_payload.py --input site --output cf-site
        - name: 发布到Cloudflare Pages
          timeout: 30m
          image: node:22
          script: |
            set -e
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "❌ 未注入 CLOUDFLARE_API_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            npx -y wrangler@latest pages deploy cf-site --project-name crawl-cars --commit-dirty=true
        - name: 发布到Codeberg Pages
          timeout: 1h
          script: |
            set -e
            if [ -z "$CODEBERG_TOKEN" ]; then
              echo "❌ 未注入 CODEBERG_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            # token 只留在环境变量里：URL 内嵌凭据会出现在进程表与构建日志中
            cat > /tmp/cb-askpass.sh <<'AASK'
            #!/bin/sh
            case "$1" in
              *sername*) echo "xuerui911" ;;
              *) printf '%s' "$CODEBERG_TOKEN" ;;
            esac
            AASK
            chmod +x /tmp/cb-askpass.sh
            # Codeberg blocks shared CNB egress; validate a fresh proxy before push.
            pkill -x mihomo || true
            unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
            : > /tmp/codeberg-proxy.env
            python scripts/setup_proxy_runtime.py --github-env /tmp/codeberg-proxy.env --test-url https://codeberg.org
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/codeberg-proxy.env > /tmp/codeberg-proxy.sh
            . /tmp/codeberg-proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ] || [ -z "${HTTPS_PROXY:-}" ]; then
              echo "Codeberg proxy unavailable; refusing direct push"
              exit 1
            fi
            curl --fail --silent --show-error --location --proxy "$HTTPS_PROXY" --connect-timeout 20 --max-time 60 https://codeberg.org -o /dev/null
            W=$(mktemp -d)
            cp -R site/. "$W/"
            printf '%s\n' 'cars3.jiucai.eu.org' > "$W/.domains"
            cd "$W"
            git init -q -b pages
            git config core.hooksPath .git/hooks
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            git add -A
            git commit -qm "pages: crawl publish $(date +%Y%m%d%H%M%S)"
            GIT_ASKPASS=/tmp/cb-askpass.sh git push --force https://codeberg.org/xuerui911/crawl-cars.git pages:pages
            rm -rf "$W" /tmp/cb-askpass.sh

        - name: 线上验收
          timeout: 30m
          script: |
            set -e
            . /tmp/cnb-date
            python - "$MERGE_DATE" <<'PY'
            import json
            import sys
            import time
            import urllib.request

            today = sys.argv[1]
            url = "https://cars2.jiucai.eu.org/data/manifest.json"
            last = None
            for attempt in range(12):
                try:
                    with urllib.request.urlopen(url, timeout=60) as r:
                        m = json.load(r)
                    if m.get("date") == today and m.get("rowCount", 0) >= 1000:
                        print(f"线上验收通过: date={m['date']} rowCount={m['rowCount']} filteredRowCount={m.get('filteredRowCount')}")
                        break
                    last = m
                except Exception as exc:
                    last = repr(exc)
                time.sleep(15)
            else:
                raise SystemExit(f"❌ 12 次轮询后线上仍是旧数据: {last}")
            PY
        - name: 回推增量状态
          timeout: 1h
          script: |
            set -e
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            # **显式白名单**，不是 `git add data`。
            # 原因（实测）：data/ 里已跟踪了 8.4MB 的 dongchedi_20260302.json、
            # 8.1MB 的 merged_20260622.json 等历史产物；.gitignore 里虽然写了
            # data/merged_*.json 等规则，但**对已跟踪文件无效**（Git 基本行为）。
            # 于是每轮回推都会把这类 MB 级文件重新提交，仓库体积不可逆地膨胀。
            # 白名单只放真正需要跨轮续跑 / 跨链路共享的：
            #   - data/dealer_prices.json：报价独立链路唯一的跨链产物
            #   - data/progress.json / dongchedi_series_list.json：断点与车系列表
            #   - crawl_state/**：汽车之家/懂车帝/易车的续跑断点
            #   - docs/analysis/**：轻量分析报告
            #发布数据（latest.json 116MB 等）走 CF/Codeberg Pages，绝不入仓。
            git add -f data/dealer_prices.json 2>/dev/null || true
            git add -f data/progress.json 2>/dev/null || true
            git add -f data/dongchedi_series_list.json 2>/dev/null || true
            git add -f data/proxies.json 2>/dev/null || true
            [ -d crawl_state ] && git add -f crawl_state || true
            [ -d docs/analysis ] && git add -f docs/analysis || true
            git add -f pages-audit-report.json 2>/dev/null || true
            #体积闸：任何超过 5MB 的暂存文件一律撤出。
            # 白名单也可能被误改（例如某个 json 被塞进 dealer_prices 旁边），
            # 宁可这一轮不回推，也不把仓库撑坏——仓库膨胀不可逆。
            BIG=$(git diff --cached --name-only | while read -r f; do
                    [ -f "$f" ] || continue
                    sz=$(wc -c < "$f")
                    [ "$sz" -gt 5242880 ] && printf '%s\n' "$f"
                  done || true)
            if [ -n "$BIG" ]; then
              echo "❌ 以下文件超过 5MB，撤出本次回推（防仓库膨胀）："
              echo "$BIG"
              echo "$BIG" | while read -r f; do git reset -q HEAD -- "$f" 2>/dev/null || true; done
            fi
            if git diff --cached --quiet; then
              echo "无增量变更"
            else
              git commit -m "chore: 半月增量爬取+发布 [skip ci]"
              git push "https://${CNB_TOKEN_USER_NAME:-cnb}:${CNB_TOKEN}@cnb.cool/xuerui911-mirror/crawl_cars.git" HEAD:main
            fi
      failStages: &cars_npc_repair_chain
        - name: 诊断-收集失败上下文
          script: |
            python - <<'PY'
            import json, os
            from pathlib import Path
            fields = ("CNB_BUILD_FAILED_STAGE_NAME", "CNB_BUILD_FAILED_MSG", "CNB_BRANCH", "CNB_COMMIT_SHORT", "CNB_BUILD_WEB_URL", "DEBUG_MODE", "RETRY_COUNT")
            context = "# 流水线失败诊断\n" + json.dumps({key: os.environ.get(key) for key in fields}, ensure_ascii=False, indent=2)
            for name in ("/tmp/autohome-step1.log", "/tmp/dongchedi-step1.log", "/tmp/dongchedi-step2.log", "/tmp/yiche-main.log", "/tmp/yiche-resume.log", "/tmp/dealer.log"):
                path = Path(name)
                if path.is_file():
                    context += "\n\n## " + name + "\n" + "\n".join(path.read_text(errors="replace").splitlines()[-100:])
            Path("_fail_context_.md").write_text(context, encoding="utf-8")
            print("失败诊断已写入 _fail_context_.md；修复前不重跑，不提交诊断到源码分支")
            PY
        - name: 清理代理
          script: pkill -x mihomo || true
        - name: NPC免费额度前置门禁
          script: &cars_npc_quota_script |
            echo "##[set-output budget_state=BLOCKED]"
            rm -f _review_result_.md
            case "${RETRY_COUNT:-0}" in
              *[!0-9]*|"") echo "INVALID_RETRY_COUNT"; exit 1 ;;
            esac
            if [ "${RETRY_COUNT:-0}" -ge 2 ]; then
              echo "##[set-output budget_state=RETRY_CAP_REACHED]"
              echo "已达两次重试上限，跳过 NPC，不声明修复成功"
              exit 0
            fi
            rc=0
            CNB_TOKEN="${CNB_AUTOFIX_TOKEN:-${CNB_TOKEN:-}}" python scripts/check_npc_free_quota.py --root-org xuerui911-mirror --unpaid-budget-confirmed --reserve-milli 50000 --report-json /tmp/cars-npc-quota.json || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "##[set-output budget_state=RUN]"
            elif [ "$rc" -eq 20 ]; then
              echo "##[set-output budget_state=FREE_QUOTA_EXHAUSTED]"
              echo "免费额度已用完，跳过 NPC，不写 PASS，不提交修改"
              exit 0
            else
              python -c 'import json;from pathlib import Path;path=Path("/tmp/cars-npc-quota.json");print("NPC 门禁拒绝：" + (str(json.loads(path.read_text()).get("reason")) if path.is_file() else "preflight execution failed"))'
              echo "NPC 门禁失败 rc=$rc；余额不足或未知权限不等同免费额度用完"
              exit "$rc"
            fi
          exports: &cars_npc_quota_exports
            budget_state: NPC_BUDGET_STATE
        - name: 备份受保护文件及固定安全检查器
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          script: |
            set -e
            cp scripts/finalize_npc_repair.py /tmp/cars-npc-guard.py
            python /tmp/cars-npc-guard.py snapshot
        - name: AI-修复-第1轮
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          type: npc:go
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: max
            maxTurns: 120
            contextWindow: 256k
            systemPrompt: |
              你是汽车爬虫修复专家。读取 _fail_context_.md，定位实际根因并做最小修复。
              允许修复 scripts/、dongchedi/、docs/ 静态前端、config/ 的正常代码，或 .cnb.yml 正常 stages 的真实工作流 bug。
              禁止修改 tests/、任何 .test.* 或 test_* 文件、AGENTS.md、ai_tools/、provider 配置。
              禁止修改 scripts/check_npc_free_quota.py、scripts/finalize_npc_repair.py、.cnb.yml 中 failStages 安全链或 /tmp 安全检查器/快照。
              不伪造数据、不刷新无新数据时间、不折叠真冲突、不删测试和校验、不降原质量门禁。
              车系/车型身份必须完整，指导价与经销商报价分离。不得 git commit、push 或重触发。
              完成后只另写 _fix_report_.md，说明根因、实际改动和验收依据；没有改动必须说明无法修复，不冒充成功。
            userPrompt: 读取真实失败上下文并执行范围内最小修复，写 _fix_report_.md。保留所有受保护文件。
        - name: 验证-实际pytest及Node和语法
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          script: |
            set -e
            python -m pytest --version >/dev/null 2>&1 || python -m pip install --disable-pip-version-check pytest
            if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'; then
              case "$(uname -m)" in
                x86_64) NODE_ARCH=x64 ;;
                aarch64) NODE_ARCH=arm64 ;;
                *) echo "unsupported Node architecture"; exit 1 ;;
              esac
              mkdir -p /tmp/cars-node-download /tmp/cars-node22
              curl --fail --silent --show-error --location --retry 2 https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt -o /tmp/cars-node-download/SHASUMS256.txt
              NODE_ARCHIVE=$(awk -v arch="$NODE_ARCH" '$2 ~ ("-linux-" arch ".tar.xz$") {print $2}' /tmp/cars-node-download/SHASUMS256.txt)
              test -n "$NODE_ARCHIVE"
              curl --fail --silent --show-error --location --retry 2 "https://nodejs.org/dist/latest-v22.x/$NODE_ARCHIVE" -o "/tmp/cars-node-download/$NODE_ARCHIVE"
              (cd /tmp/cars-node-download && sha256sum --check --ignore-missing SHASUMS256.txt)
              tar -xJf "/tmp/cars-node-download/$NODE_ARCHIVE" --strip-components=1 -C /tmp/cars-node22
              export PATH="/tmp/cars-node22/bin:$PATH"
            fi
            node --version
            python /tmp/cars-npc-guard.py validate
        - name: NPC审核前免费额度复查
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          script: *cars_npc_quota_script
          exports: *cars_npc_quota_exports
        - name: 审查-GLM只读交叉评审
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          type: npc:go
          options:
            model: glm-5.3-flash
            thinkingLevel: high
            maxTurns: 20
            contextWindow: 128k
            systemPrompt: |
              你是独立只读审查员。读取 _fail_context_.md、_fix_report_.md、_repair_diff_.patch、_test_after_fix_.txt 和 /tmp/cars-npc-repair/validated.json。
              只读检查 git diff 及报告：根因是否解决、车型身份、报价分离、数据真实性、完整覆盖与所有原质量门禁是否保持。
              tests/、AGENTS.md、ai_tools/、安全脚本和 failStages 链不能改变。测试必须真实退出0，不能以改断言掩盖问题。
              不得修改源码、测试、配置、修复报告或安全快照，不得 commit、push、重跑。
              唯一允许写的文件是 _review_result_.md。第一行必须精确为 VERDICT: PASS 或 VERDICT: FAIL，随后给出逐项证据。
              缺少 validated.json、测试非0、无实际修复、无法确认正确或安全门禁变弱时必须 FAIL。
            userPrompt: '只读审核修复diff及实际测试报告，唯一写入 _review_result_.md，首行严格 VERDICT: PASS 或 VERDICT: FAIL。'
        - name: 最终门禁-仅提交已验证已审核修复并固定SHA重跑
          if: '[ "$NPC_BUDGET_STATE" = "RUN" ]'
          script: python /tmp/cars-npc-guard.py finalize

  "crontab: 5 8 1,16 * *":
    # 半月增量爬取（每月 1/16 日 08:05 Asia/Shanghai，落在人类作息窗口 08:00-12:30 内；对齐负责人半月增量本意，撤销 09-20 移植期错峰 5/20）
    # 汽车之家/懂车帝走 --incremental 只爬新增车系；易车不带 GitHub 时代 artifact 断点恢复（CNB 无 artifact）
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      # CNB Job 无输出默认 10min 即强杀；爬虫按窗口预算最长可跑 ~5.25h（08:05 触发，
      # 易车 10800s + 汽车之家/懂车帝各 2700s×3）加合并发布，10h 覆盖最坏情况
      timeout: 10h
      stages:
        - name: 检查代理配置
          script: |
            if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
              echo "❌ 未注入 PROXY_SUBSCRIPTIONS：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。防反爬必须走 Mihomo 代理。"
              exit 1
            fi
        - name: install-deps
          script: python -m pip install -r requirements.txt
        - name: 安装浏览器
          script: |
            # test_autohome.py 第四步与 crawl_dongchedi.py 依赖 Chrome/chromedriver（GitHub 侧用 setup-chrome@v2 + setup-chromedriver@v2）
            set -e
            if command -v chromedriver >/dev/null 2>&1; then
              chromedriver --version
              exit 0
            fi
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends chromium chromium-driver
            chromedriver --version
        - name: 启动Mihomo代理
          script: |
            set -e
            # 本仓 setup_proxy_runtime.py 只支持 --github-env（无 --require-proxy/--clear），且代理失败会降级直连，故显式硬校验
            : > /tmp/proxy.env
            python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --test-url https://www.autohome.com.cn
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
            . /tmp/proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ]; then
              echo "❌ 代理未启用（PROXY_ENABLED!=true），防反爬要求禁止直连裸爬，终止本轮"
              exit 1
            fi
            printf 'export CHROME_PROXY_SERVER=http://127.0.0.1:7890\n' >> /tmp/proxy.sh
            . /tmp/proxy.sh
            echo "代理就绪：$HTTP_PROXY"
        - name: 获取线上发布基线
          timeout: 1h
          script: |
            set -e
            # 只使用最新完整 immutable CNB Release；下载或校验失败即中止，不退回仓内旧 docs/旧 Pages/空数据。
            rm -rf /tmp/cnb-verified-baseline-assets /tmp/cnb-verified-baseline-site
            python scripts/download_verified_release.py --repo Fatty911/crawl_cars --no-legacy --dir /tmp/cnb-verified-baseline-assets
            python scripts/prepare_cnb_pages.py --archive /tmp/cnb-verified-baseline-assets/verified-site.zip --manifest /tmp/cnb-verified-baseline-assets/manifest.json --site /tmp/cnb-verified-baseline-site
            python - <<'PY'
            import json, shutil
            from pathlib import Path
            site = Path("/tmp/cnb-verified-baseline-site")
            manifest = json.loads((site / "data/manifest.json").read_text(encoding="utf-8"))
            source = site / manifest["files"]["latestJson"]
            if not source.resolve().is_relative_to(site.resolve()):
                raise ValueError("baseline path escapes verified site")
            payload = json.loads(source.read_text(encoding="utf-8"))
            if not isinstance(payload, list):
                raise ValueError("verified baseline must be an array")
            rows = payload
            if len(rows) < 10000:
                raise ValueError(f"verified baseline incomplete: {len(rows)} rows < 10000")
            target = Path("/tmp/cnb-baseline/latest.json")
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(source, target)
            print(f"verified immutable baseline: {len(rows)} rows -> {target}")
            PY
        - name: 分配爬取时间预算
          script: |
            set -e
            # CNB 有 120min 流水线硬上限（日志明示 maximum pipeline duration is exceeded: 120min），
            # 超时整条构建被杀 —— 本轮无论爬到哪一步都拿不到产物，Pages 只能停在上一轮日期。
            # GitHub Actions 时代各源 --time-limit 各自独立（汽车之家/懂车帝各 2700s、
            # 易车最长 21000s），相加远超 CNB 上限，等于「每源留足预算 = 每源都被腰斩」。
            # 这里按权重把总预算切给各爬取步，env 落盘供后续 stage source。
            # 旧的 MR/BN_MR/TB 等死变量已删除：代码里没有任何 os.getenv 读它们（已全仓核查）。
            python scripts/allocate_crawl_budget.py \
              --output /tmp/cnb-crawl-budget.env \
              --elapsed-seconds "$(python scripts/pipeline_elapsed_seconds.py)"
            cat /tmp/cnb-crawl-budget.env
        - name: 爬取-汽车之家
          timeout: 1h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$AUTOHOME_STEP1_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            # step1 的 --time-limit 从「硬编码 2700」改为读预算分配器：
            # DEBUG_MODE 时为 480s（能跑通全链并刷新 Pages 日期），
            # 生产时按权重从 120min 上限里切，且与懂车帝/易车共享同一总预算。
            # max-cars 同理：DEBUG 时限 20 个车系、跳过全量历史发现，否则 0=不限制。
            AH_MAX_CARS=0
            if [ "${DEBUG_MODE:-false}" = "true" ]; then AH_MAX_CARS=20; fi
            echo "汽车之家预算: step1 time-limit=${AUTOHOME_STEP1_TIME_LIMIT}s max-cars=${AH_MAX_CARS} debug=${CRAWL_BUDGET_DEBUG}"
            # 输出落盘 + 尾部回显 + 保留退出码：失败时由 failStages 收集尾部日志供诊断
            rc=0
            python scripts/test_autohome.py --step 1 --auto \
              --time-limit "$AUTOHOME_STEP1_TIME_LIMIT" --max-cars "$AH_MAX_CARS" --incremental \
              > /tmp/autohome-step1.log 2>&1 || rc=$?
            tail -n 20 /tmp/autohome-step1.log
            if [ $rc -eq 0 ]; then echo "汽车之家 step1 完成"
            elif [ $rc -eq 10 ]; then echo "汽车之家 step1 预算到点收尾（设计内，进度已保存）"
            else echo "汽车之家 step1 失败 rc=$rc，继续后续步骤"; fi
            for s in 2 3 4 5 6; do
              python scripts/test_autohome.py --step $s || echo "汽车之家 step$s 失败，继续"
            done
        - name: 归一化汽车之家产物路径
          script: |
            # test_autohome.py:1871 写 scripts/，merge_data.py 只在仓根 glob；对齐 GitHub crawl-autohome.yml:428-438
            # POSIX 版：09-30 实测 bash 数组/nullglob 写法在增量零产出场景下使本 stage error（12:07/13:59 两轮），
            # 改 find+cp，任何 shell、任何产物状态都不阻断；产物有无由下游合并的 nullglob 容错自然处理
            find scripts -maxdepth 1 -name 'autoHome_*.json' -exec cp -pf {} . \; || true
            find scripts -maxdepth 1 -name 'autoHome_*.csv' -exec cp -pf {} . \; || true
            ls -l autoHome_*.json autoHome_*.csv 2>/dev/null || echo "仓根无 autoHome_* 产物（零产出或增量无新增，继续）"
            exit 0
        - name: 爬取-懂车帝
          timeout: 2h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$DONGCHEDI_STEP1_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            # crawl_dongchedi.py:17 依赖仓根在 sys.path（GitHub crawl-dongchedi.yml:41 的 PYTHONPATH）
            export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
            # 与 api_trigger 同语义：debug 开关是 --debug-limit，预算来自分配器。
            # （此前此处连 api_trigger 的 debug 分支都没有，重跑永远按全量 2700s 跑，必然再超时）
            DCD_DEBUG_ARGS=""
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              DCD_DEBUG_ARGS="--debug-limit 20"
            fi
            echo "懂车帝预算: step1=${DONGCHEDI_STEP1_TIME_LIMIT}s step2=${DONGCHEDI_STEP2_TIME_LIMIT}s debug=${CRAWL_BUDGET_DEBUG} args='${DCD_DEBUG_ARGS}'"
            # 输出落盘 + 尾部回显 + 保留退出码：失败时由 failStages 收集尾部日志供诊断
            rc=0
            # shellcheck disable=SC2086  # DCD_DEBUG_ARGS 需按两个词拆开
            timeout --signal=TERM --kill-after=15s "$((DONGCHEDI_STEP1_TIME_LIMIT + 30))s" python scripts/crawl_dongchedi.py --step 1 --auto \
              --time-limit "$DONGCHEDI_STEP1_TIME_LIMIT" $DCD_DEBUG_ARGS \
              > /tmp/dongchedi-step1.log 2>&1 || rc=$?
            tail -n 20 /tmp/dongchedi-step1.log
            if [ $rc -eq 0 ]; then echo "懂车帝 step1 完成"
            elif [ $rc -eq 10 ]; then echo "懂车帝 step1 预算到点收尾（设计内，进度已保存）"
            else echo "懂车帝 step1 失败 rc=$rc，继续后续步骤"; fi
            rc=0
            # shellcheck disable=SC2086  # DCD_DEBUG_ARGS 需按两个词拆开
            timeout --signal=TERM --kill-after=15s "$((DONGCHEDI_STEP2_TIME_LIMIT + 30))s" python scripts/crawl_dongchedi.py --step 2 --auto \
              --time-limit "$DONGCHEDI_STEP2_TIME_LIMIT" --max-series 0 --incremental $DCD_DEBUG_ARGS \
              > /tmp/dongchedi-step2.log 2>&1 || rc=$?
            tail -n 20 /tmp/dongchedi-step2.log
            if [ $rc -eq 0 ]; then echo "懂车帝 step2 完成"
            elif [ $rc -eq 10 ]; then echo "懂车帝 step2 预算到点收尾（设计内，进度已保存）"
            else echo "懂车帝 step2 失败 rc=$rc，继续"; fi
            # 到点保存的配置也要解析成源产物，才能进入本轮增量合并。
            python scripts/crawl_dongchedi.py --step 3 || echo "懂车帝本轮无可解析配置，保留基线"
            python scripts/crawl_dongchedi.py --step 4 || echo "懂车帝本轮无新产物，保留基线"
        - name: 归一化懂车帝产物路径
          script: |
            # crawl_dongchedi.py 写 scripts/，merge_data.py 只在仓根 glob；对齐 GitHub crawl-dongchedi.yml
            # POSIX 版（对齐「归一化汽车之家产物路径」09-30 修复）：shopt/bash 数组在 sh(dash) 下
            # 直接语法错误或 127，改 find+cp，任何 shell、任何产物状态都不阻断
            find scripts -maxdepth 1 -name 'dongchedi_*.json' -exec cp -pf {} . \; || true
            find scripts -maxdepth 1 -name 'dongchedi_*.csv' -exec cp -pf {} . \; || true
            ls -l dongchedi_*.json dongchedi_*.csv 2>/dev/null || echo "仓根无 dongchedi_* 产物（零产出或增量无新增，继续）"
            exit 0
        - name: 爬取-易车
          timeout: 6h
          script: |
            . /tmp/proxy.sh
            . /tmp/cnb-crawl-budget.env
            [ "$YICHE_TIME_LIMIT" -gt 0 ] || { echo "爬取预算已耗尽，保留完整基线进入发布"; exit 0; }
            YICHE_STARTED=$(date +%s)
            # 预算必须同时受两个上限约束，取更严的那个：
            #   ① 作息窗口（GitHub 原设计 morning 10800 / afternoon 21000，北京时间
            #      08:00-12:30 与 13:00-22:00，窗口末留 900s安全缓冲）——
            #      这是「什么时候爬」的人为约束；
            #   ② CNB 流水线 120min 硬上限 —— 这是「最多能爬多久」的物理约束。
            # 移植到 CNB 后 configure 被裸调、RUN_TIME 从未落地，退化成硬编码 2700；
            # 现在窗口值由 configure 给出并写盘，且被分配器的 YICHE_TIME_LIMIT 钳制。
            python scripts/crawl_budget.py configure --github-env /tmp/cnb-yiche-window.env --github-output /tmp/cnb-yiche-window.out || true
            [ -f /tmp/cnb-yiche-window.env ] && . /tmp/cnb-yiche-window.env
            WINDOW_RUN_TIME="${RUN_TIME:-0}"
            if [ "$WINDOW_RUN_TIME" -le 0 ]; then
              # 窗口外：窗口预算为 0，此时只受分配器约束（分配器已扣掉发布阶段开销）
              RUN_TIME="$YICHE_TIME_LIMIT"
              echo "易车预算: 窗口外，取分配器预算 RUN_TIME=${RUN_TIME}s"
            elif [ "$WINDOW_RUN_TIME" -lt "$YICHE_TIME_LIMIT" ]; then
              RUN_TIME="$WINDOW_RUN_TIME"
              echo "易车预算: 取窗口预算 RUN_TIME=${RUN_TIME}s（窗口 08:00-12:30 / 13:00-22:00, 缓冲 900s）"
            else
              RUN_TIME="$YICHE_TIME_LIMIT"
              echo "易车预算: 窗口给出 ${WINDOW_RUN_TIME}s 但 120min 上限只允许 ${RUN_TIME}s，取后者"
            fi
            # 断点必须落在 crawl_state/：既被「回推增量状态」的 git add 覆盖（跨轮累积），
            # 又不匹配 merge 的 yiche_*.json glob（不污染合并）。
            mkdir -p crawl_state
            export YICHE_CHECKPOINT_PATH=crawl_state/yiche_frontier.json
            # POSIX 版：bash 数组在 sh(dash) 下语法错误，改用 set --/"$@" 收集续跑参数
            set --
            if [ -s "$YICHE_CHECKPOINT_PATH" ]; then
              set -- "$@" \
                --resume-checkpoint "$YICHE_CHECKPOINT_PATH" \
                --resume-source-run-id "" \
                --resume-source-artifact-id "" \
                --resume-source-artifact-sha256 "" \
                --resume-source-checkpoint-sha256 "$(sha256sum "$YICHE_CHECKPOINT_PATH" | cut -d' ' -f1)" \
                --resume-source-head-sha "" \
                --resume-source-crawler-sha256 "$(sha256sum scripts/crawl_yiche.py | cut -d' ' -f1)"
              brands_remaining=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('remaining_brands', '?'))" "$YICHE_CHECKPOINT_PATH" 2>/dev/null || echo '?')
              echo "易车续跑：基于上一轮断点 $YICHE_CHECKPOINT_PATH (brands_remaining=$brands_remaining)"
            else
              echo "易车首轮：无断点，按全量发现起始"
            fi
            # DEBUG 模式限量车系数，与懂车帝 --debug-limit 同一语义（限的是工作量，不是时间）
            YICHE_EXTRA_ARGS=""
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              YICHE_EXTRA_ARGS="--max-series 20"
            fi
            rc=0
            # shellcheck disable=SC2086  # YICHE_EXTRA_ARGS 需按两个词拆开
            python scripts/crawl_yiche.py --time-limit "$RUN_TIME" --max-series 0 \
              "$@" $YICHE_EXTRA_ARGS --output "yiche_$(date +%Y%m%d).json" \
              > /tmp/yiche-main.log 2>&1 || rc=$?
            tail -n 20 /tmp/yiche-main.log
            if [ $rc -eq 0 ]; then echo "易车 单源失败 rc=$rc，继续 完成"
            elif [ $rc -eq 10 ]; then echo "易车 单源失败 rc=$rc，继续 预算到点收尾（设计内，进度已保存）"
            else echo "易车 单源失败 rc=$rc，继续"; fi
            cp /tmp/yiche-main.log crawl_state/yiche-last-run.log 2>/dev/null || true
            # 续跑被判定不兼容时会一行不产；退回首轮，保证本轮仍有易车数据可合并。
            # 重爬预算必须再砍半：它是在主爬已经花掉 RUN_TIME 之后追加的，
            # 不砍半就会把「分配器算好的总额」直接吃掉，合并阶段被腰斩。
            YICHE_REMAINING=$((RUN_TIME - $(date +%s) + YICHE_STARTED))
            if [ ! -s "yiche_$(date +%Y%m%d).json" ] && [ "$YICHE_REMAINING" -gt 0 ]; then
              echo "⚠️ 易车本轮无产出，退回首轮重爬"
              rm -f "$YICHE_CHECKPOINT_PATH"
              python scripts/crawl_yiche.py --time-limit "$YICHE_REMAINING" --max-series 0 \
                --output "yiche_$(date +%Y%m%d).json" \
                || echo "易车 重爬仍失败，继续"
            fi
        - name: 清理代理进程
          script: pkill -x mihomo || true
        - name: 合并-增量保留基线
          timeout: 30m
          script: |
            set -e
            DATE=$(date +%Y%m%d)
            BASELINE=/tmp/cnb-baseline/latest.json
            # 跨阶段共用同一日期键，避免 merge_data.py 与发布阶段在 UTC/本地跨零点时取到不同日期
            echo "export MERGE_DATE=$DATE" > /tmp/cnb-date
            export MERGE_DATE=$DATE
            # crawl_yiche 的断点文件同名匹配 yiche_*.json，而 merge_data.py:2388 find_latest 取 mtime 最新者；
            # 断点是 dict 而非行数组，被选中会污染或炸合并，先移出 glob 视野
            mkdir -p /tmp/cnb-checkpoints
            for f in yiche_checkpoint.json yiche_progress.json; do
              [ -f "$f" ] && mv -f "$f" /tmp/cnb-checkpoints/ || true
            done
            # POSIX 版：shopt 是 bash 内建，CNB runner 用 sh(dash) 执行会 127 挂掉（phones 实证）
            # 用循环收集存在的文件模拟 nullglob，零产出时 $# 仍为 0
            set --
            for f in autoHome_*.json dongchedi_*.json yiche_*.json; do
              [ -f "$f" ] && set -- "$@" "$f"
            done
            [ $# -gt 0 ] || { echo "❌ 三个源均无数据文件，无法合并"; exit 1; }
            python scripts/merge_data.py
            [ -s "merged_${DATE}.json" ] || { echo "❌ merge_data.py 未产出 merged_${DATE}.json"; exit 1; }
            python scripts/preserve_publish_baseline.py \
              --baseline "$BASELINE" \
              --merged-json "merged_${DATE}.json" \
              --merged-csv "merged_${DATE}.csv" \
              --filtered-json "filtered_cars_${DATE}.json" \
              --filtered-csv "filtered_cars_${DATE}.csv"
            python scripts/verify_publish_superset.py \
              --baseline "$BASELINE" \
              --candidate "merged_${DATE}.json"
        - name: 组装发布站点
          timeout: 30m
          script: |
            set -e
            . /tmp/cnb-date
            DATE=$MERGE_DATE
            BASELINE=/tmp/cnb-baseline/latest.json
            ROWS=$(python -c "import json; print(len(json.load(open('merged_${DATE}.json', encoding='utf-8'))))")
            if [ "$ROWS" -lt 1000 ]; then
              echo "❌ 合并数据少于 1000 行（当前 $ROWS），疑似爬取不完整，拒绝发布"
              exit 1
            fi
            # 对齐 GitHub merge-and-filter.yml:736-739,830-877：site/ 每次重建，时间戳文件不在仓内累积
            rm -rf site
            mkdir -p site/data site/config
            cp -R docs/. site/
            cp config/filter_conditions.json site/config/filter_conditions.json
            cp "merged_${DATE}.json" site/data/latest.json
            cp "filtered_cars_${DATE}.json" site/data/filtered.json
            # 报价已由独立链路（crontab: 37 8 * * 0）刷新，
            # 这里必须开 --refresh-dealer-prices，否则陈旧报价不会被更新
            python scripts/prepare_pages_payload.py --input site/data/latest.json --output site/data/latest.json --min-year 2022 --refresh-dealer-prices
            python scripts/prepare_pages_payload.py --input site/data/filtered.json --output site/data/filtered.json --min-year 2022
            python scripts/audit_pages_payload.py \
              --baseline "$BASELINE" \
              --candidate site/data/latest.json \
              --report pages-audit-report.json \
              --head-sha "$CNB_COMMIT"
            cp "merged_${DATE}.csv" "site/data/merged_${DATE}.csv"
            cp "filtered_cars_${DATE}.csv" "site/data/filtered_cars_${DATE}.csv"
            python - "$DATE" <<'PY'
            import json
            import shutil
            import sys
            from datetime import datetime, timezone

            date = sys.argv[1]
            with open("site/data/latest.json", encoding="utf-8") as f:
                latest = json.load(f)
            with open("site/data/filtered.json", encoding="utf-8") as f:
                filtered = json.load(f)
            stamp = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
            shutil.copy("site/data/latest.json", f"site/data/latest_{stamp}.json")
            shutil.copy("site/data/filtered.json", f"site/data/filtered_{stamp}.json")
            manifest = {
                "date": date,
                "updatedAt": datetime.now(timezone.utc).isoformat(),
                "rowCount": len(latest),
                "filteredRowCount": len(filtered),
                "files": {
                    "latestJson": f"data/latest_{stamp}.json",
                    "filteredJson": f"data/filtered_{stamp}.json",
                    "latestCsv": f"data/merged_{date}.csv",
                    "filteredCsv": f"data/filtered_cars_{date}.csv",
                },
            }
            with open("site/data/manifest.json", "w", encoding="utf-8") as f:
                json.dump(manifest, f, ensure_ascii=False, indent=2)
            print(manifest)
            PY
            touch site/.nojekyll
            mkdir -p docs/analysis
            python scripts/analysis/merge_evidence_report.py --input "merged_${DATE}.json" --output docs/analysis/merge_evidence_report.json || true
            python scripts/crawl_zero_to_whole_ratio.py || true
        - name: 验证渲染数据
          timeout: 30m
          image: node:22
          script: node scripts/verify_pages_rendered_data.js site/data/latest.json
        - name: 推送数据到GitHub Release
          timeout: 25m
          script: |
            set -e
            python scripts/publish_github_release.py --site-dir site --repo Fatty911/crawl_cars --workflow cnb-pages.yml
        - name: 组装Cloudflare完整分片
          timeout: 20m
          script: |
            set -e
            rm -rf cf-site
            python scripts/prepare_cloudflare_payload.py --input site --output cf-site
        - name: 发布到Cloudflare Pages
          timeout: 30m
          image: node:22
          script: |
            set -e
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "❌ 未注入 CLOUDFLARE_API_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            npx -y wrangler@latest pages deploy cf-site --project-name crawl-cars --commit-dirty=true
        - name: 发布到Codeberg Pages
          timeout: 1h
          script: |
            set -e
            if [ -z "$CODEBERG_TOKEN" ]; then
              echo "❌ 未注入 CODEBERG_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            # token 只留在环境变量里：URL 内嵌凭据会出现在进程表与构建日志中
            cat > /tmp/cb-askpass.sh <<'AASK'
            #!/bin/sh
            case "$1" in
              *sername*) echo "xuerui911" ;;
              *) printf '%s' "$CODEBERG_TOKEN" ;;
            esac
            AASK
            chmod +x /tmp/cb-askpass.sh
            # Codeberg blocks shared CNB egress; validate a fresh proxy before push.
            pkill -x mihomo || true
            unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
            : > /tmp/codeberg-proxy.env
            python scripts/setup_proxy_runtime.py --github-env /tmp/codeberg-proxy.env --test-url https://codeberg.org
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/codeberg-proxy.env > /tmp/codeberg-proxy.sh
            . /tmp/codeberg-proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ] || [ -z "${HTTPS_PROXY:-}" ]; then
              echo "Codeberg proxy unavailable; refusing direct push"
              exit 1
            fi
            curl --fail --silent --show-error --location --proxy "$HTTPS_PROXY" --connect-timeout 20 --max-time 60 https://codeberg.org -o /dev/null
            W=$(mktemp -d)
            cp -R site/. "$W/"
            printf '%s\n' 'cars3.jiucai.eu.org' > "$W/.domains"
            cd "$W"
            git init -q -b pages
            git config core.hooksPath .git/hooks
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            git add -A
            git commit -qm "pages: crawl publish $(date +%Y%m%d%H%M%S)"
            GIT_ASKPASS=/tmp/cb-askpass.sh git push --force https://codeberg.org/xuerui911/crawl-cars.git pages:pages
            rm -rf "$W" /tmp/cb-askpass.sh
        - name: 线上验收
          timeout: 30m
          script: |
            set -e
            . /tmp/cnb-date
            python - "$MERGE_DATE" <<'PY'
            import json
            import sys
            import time
            import urllib.request

            today = sys.argv[1]
            url = "https://cars2.jiucai.eu.org/data/manifest.json"
            last = None
            for attempt in range(12):
                try:
                    with urllib.request.urlopen(url, timeout=60) as r:
                        m = json.load(r)
                    if m.get("date") == today and m.get("rowCount", 0) >= 1000:
                        print(f"线上验收通过: date={m['date']} rowCount={m['rowCount']} filteredRowCount={m.get('filteredRowCount')}")
                        break
                    last = m
                except Exception as exc:
                    last = repr(exc)
                time.sleep(15)
            else:
                raise SystemExit(f"❌ 12 次轮询后线上仍是旧数据: {last}")
            PY
        - name: 回推增量状态
          timeout: 1h
          script: |
            set -e
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            # **显式白名单**，不是 `git add data`。
            # 原因（实测）：data/ 里已跟踪了 8.4MB 的 dongchedi_20260302.json、
            # 8.1MB 的 merged_20260622.json 等历史产物；.gitignore 里虽然写了
            # data/merged_*.json 等规则，但**对已跟踪文件无效**（Git 基本行为）。
            # 于是每轮回推都会把这类 MB 级文件重新提交，仓库体积不可逆地膨胀。
            # 白名单只放真正需要跨轮续跑 / 跨链路共享的：
            #   - data/dealer_prices.json：报价独立链路唯一的跨链产物
            #   - data/progress.json / dongchedi_series_list.json：断点与车系列表
            #   - crawl_state/**：汽车之家/懂车帝/易车的续跑断点
            #   - docs/analysis/**：轻量分析报告
            #发布数据（latest.json 116MB 等）走 CF/Codeberg Pages，绝不入仓。
            git add -f data/dealer_prices.json 2>/dev/null || true
            git add -f data/progress.json 2>/dev/null || true
            git add -f data/dongchedi_series_list.json 2>/dev/null || true
            git add -f data/proxies.json 2>/dev/null || true
            [ -d crawl_state ] && git add -f crawl_state || true
            [ -d docs/analysis ] && git add -f docs/analysis || true
            git add -f pages-audit-report.json 2>/dev/null || true
            #体积闸：任何超过 5MB 的暂存文件一律撤出。
            # 白名单也可能被误改（例如某个 json 被塞进 dealer_prices 旁边），
            # 宁可这一轮不回推，也不把仓库撑坏——仓库膨胀不可逆。
            BIG=$(git diff --cached --name-only | while read -r f; do
                    [ -f "$f" ] || continue
                    sz=$(wc -c < "$f")
                    [ "$sz" -gt 5242880 ] && printf '%s\n' "$f"
                  done || true)
            if [ -n "$BIG" ]; then
              echo "❌ 以下文件超过 5MB，撤出本次回推（防仓库膨胀）："
              echo "$BIG"
              echo "$BIG" | while read -r f; do git reset -q HEAD -- "$f" 2>/dev/null || true; done
            fi
            if git diff --cached --quiet; then
              echo "无增量变更"
            else
              git commit -m "chore: 半月增量爬取+发布 [skip ci]"
              git push "https://${CNB_TOKEN_USER_NAME:-cnb}:${CNB_TOKEN}@cnb.cool/xuerui911-mirror/crawl_cars.git" HEAD:main
            fi
      failStages: *cars_npc_repair_chain

  pull_request:
    - stages:
        - name: NPC-PR审查
          type: npc:go
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: high
            maxTurns: 20
            systemPrompt: |
              你是代码审查员。审查PR：车系身份完整、报价字段分离、merge门禁、测试断言同步。
              给出 PASS 或 FAIL 及理由。
            userPrompt: 审查本次 PR 的代码变更。
        # 原稿在此挂 CF/Codeberg 部署（且部署无数据的 docs/）——GitHub 的 deploy-frontend.yml 不由 PR 触发，
        # PR 部署会用空数据覆盖生产站点，故移除；发布统一走 crontab 数据链（site/ 含数据）。

  # ══ 经销商报价独立链路 ══
  # 失败域隔离：报价失败不许拖住基础属性链。详见 dealer_chain.yml 头部注释。
  "crontab: 37 8 * * 0":
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      # 独立预算 60min：实测全量约 13-17 分钟，够用。
      # 它再也不会拖累基础属性链的 120min。
      timeout: 1h
      stages:
          - name: 检查代理配置
            script: |
              if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
                echo "❌ 未注入 PROXY_SUBSCRIPTIONS：报价爬取经 imports 引用 crawl-secrets env.yml，请检查该私仓。"
                exit 1
              fi
          - name: install-deps
            script: python -m pip install -r requirements.txt
          - name: 启动Mihomo代理
            script: |
              set -e
              : > /tmp/proxy.env
              OK=0
              for ATTEMPT in 1 2 3; do
                echo "[proxy] attempt $ATTEMPT/3 $(date -u +%H:%M:%S)"
                : > /tmp/proxy.env
                if python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --test-url https://www.autohome.com.cn; then
                  OK=1; break
                fi
                echo "[proxy] attempt $ATTEMPT failed, retry in 15s"
                sleep 15
              done
              if [ "$OK" != "1" ]; then
                echo "FAIL_STAGE=启动Mihomo代理 reason=3-attempts-exhausted"; exit 1
              fi
              sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
              . /tmp/proxy.sh
              if [ "${PROXY_ENABLED:-false}" != "true" ]; then
                echo "❌ 代理未启用（PROXY_ENABLED!=true），防反爬要求禁止直连裸爬，终止本轮"
                exit 1
              fi
              echo "代理就绪：$HTTP_PROXY"
          - name: 下载线上发布数据（车系ID 来源）
            timeout: 25m
            script: |
              set -e
              # 只使用最新完整 immutable CNB Release；下载或校验失败即中止，不退回仓内旧 docs/旧 Pages/空数据。
              rm -rf /tmp/cnb-verified-baseline-assets /tmp/cnb-verified-baseline-site
              python scripts/download_verified_release.py --repo Fatty911/crawl_cars --no-legacy --dir /tmp/cnb-verified-baseline-assets
              python scripts/prepare_cnb_pages.py --archive /tmp/cnb-verified-baseline-assets/verified-site.zip --manifest /tmp/cnb-verified-baseline-assets/manifest.json --site /tmp/cnb-verified-baseline-site
              python - <<'PY'
              import json, shutil
              from pathlib import Path
              site = Path("/tmp/cnb-verified-baseline-site")
              manifest = json.loads((site / "data/manifest.json").read_text(encoding="utf-8"))
              source = site / manifest["files"]["latestJson"]
              if not source.resolve().is_relative_to(site.resolve()):
                  raise ValueError("baseline path escapes verified site")
              payload = json.loads(source.read_text(encoding="utf-8"))
              if not isinstance(payload, list):
                  raise ValueError("verified baseline must be an array")
              rows = payload
              if len(rows) < 10000:
                  raise ValueError(f"verified baseline incomplete: {len(rows)} rows < 10000")
              target = Path("/tmp/dealer-baseline/latest.json")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              print(f"verified immutable baseline: {len(rows)} rows -> {target}")
              PY
          - name: 增量爬取经销商报价
            timeout: 35m
            script: |
              . /tmp/proxy.sh
              # --time-limit 是硬边界：到点即收尾，已抓到的部分照常落盘并过闸
              # （脚本内 timed_out 分支），不会因「没跑完」丢弃整轮成果。
              rc=0
              python scripts/crawl_dealer_prices.py \
                --series-input /tmp/dealer-baseline/latest.json \
                --min-rows 300 --delay 0.3 --time-limit 1500 \
                > /tmp/dealer.log 2>&1 || rc=$?
              tail -n 25 /tmp/dealer.log
              if [ $rc -ne 0 ]; then
                # rc=1 = 未达 min-rows（可能限流/大面失败/超时且抓得不够）。
                # 此时**绝不覆盖** data/dealer_prices.json：
                # 用残缺数据覆盖等于把好数据换成坏数据，比不更新糟糕得多。
                echo "⚠️ 本轮报价未达 min-rows，保留现有 data/dealer_prices.json 不变（宁可不更新，不用残缺覆盖）"
                exit 1
              fi
              python - <<'PY'
              import json
              d = json.load(open("data/dealer_prices.json", encoding="utf-8"))
              series = d.get("series") or {}
              cars = sum(len(v) for v in series.values())
              print(f"报价已刷新：车系数={len(series)} 车型数={cars} updated_at={d.get('updated_at')}")
              PY
          - name: 清理代理进程
            script: pkill -x mihomo || true
          - name: 回推报价数据
            timeout: 20m
            script: |
              set -e
              git config user.email "xuerui911@gmail.com"
              git config user.name "Fatty911"
              # 只回推报价文件（3.5MB 级）；发布数据走 CF/Codeberg，不进仓
              git add data/dealer_prices.json
              if git diff --cached --quiet; then
                echo "报价无变化"
              else
                git commit -m "chore: refresh dealer prices [dealer-chain]"
                git push "https://${CNB_TOKEN_USER_NAME:-cnb}:${CNB_TOKEN}@cnb.cool/xuerui911-mirror/crawl_cars.git" HEAD:main
                echo "✅ 报价已回推；下一轮基础属性链会用它覆盖 Pages 上的陈旧经销商参考价"
              fi
          - name: 触发基础属性链部署（让报价立刻生效）
            timeout: 10m
            script: |
              # 报价提交后触发主链，让新报价立刻进 Pages——对齐 GitHub
              # 「提交报价 → gh workflow run merge-and-filter.yml」的二段式语义。
              # 失败不阻断：报价已入库，下一次主链自然会带上。
              rc=0
              curl --fail --silent --show-error --max-time 60 \
                -X POST "https://api.cnb.cool/xuerui911-mirror/crawl_cars/-/build/start" \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/vnd.cnb.api+json" \
                -d "{\"branch\":\"main\",\"event\":\"api_trigger\"}" \
                || rc=$?
              if [ $rc -eq 0 ]; then
                echo "已触发基础属性链，报价将随本轮发布生效"
              else
                echo "⚠️ 触发主链失败 rc=$rc（不影响报价入库，下轮自动生效）"
              fi
              exit 0
          - name: 失败诊断归档
            if: failure()
            script: |
              # 失败现场推 diag 分支；**绝不自动重跑**——
              # 报价是「锦上添花」，反复重跑只占带宽并可能与基础属性链抢带宽。
              mkdir -p diag
              [ -f /tmp/dealer.log ] && cp -pf /tmp/dealer.log diag/ || true
              git config user.email "xuerui911@gmail.com"
              git config user.name "cnb-diag"
              git add diag
              git commit -m "chore: 报价链失败诊断 [skip ci]" || echo "diag 无新增"
              git push -f "https://${CNB_TOKEN_USER_NAME:-cnb}:${CNB_TOKEN}@cnb.cool/xuerui911-mirror/crawl_cars.git" HEAD:refs/heads/diag \
                || echo "diag 推送失败（不阻断）"
  $:
    issue.open:
      - stages:
          - name: 检查fix标签
            script: echo "$CNB_ISSUE_LABELS" | grep -q 'fix' || exit 0
          - name: AI-Issue驱动修复
            type: npc:go
            options:
              model: deepseek-v4.1-flash
              thinkingLevel: max
              maxTurns: 50
              contextWindow: 256k
              systemPrompt: |
                你是自动化修复 Agent。读取 Issue，理解需求，读代码定位，修改，运行 pytest，创建 PR。
                规则：不伪造数据、不折叠真冲突、不删校验、不降防护
              userPrompt: |
                Issue 标题: $CNB_ISSUE_TITLE
                Issue 描述: $CNB_ISSUE_DESCRIPTION
