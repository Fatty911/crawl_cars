# crawl_cars — CNB 流水线：push CI+AI 自修复 / 半月增量爬取
# 增量闭环：爬取→合并→保留基线→产物与断点提交回本仓，下轮 checkout 基于上轮基线续爬合并
# 代理：PROXY_SUBSCRIPTIONS 走 CNB 仓库环境变量（设置→环境变量），缺失即失败，禁止直连裸爬
# 模型: deepseek-v4.1-flash（修复）+ glm-5.3-flash（只读交叉审查）

main:
  push:
    - docker:
        image: python:3.11
      env:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
      stages:
        - name: install-deps
          script: |
            python -m pip install --disable-pip-version-check -r requirements.txt || true
            # pytest 是 push CI 测试闸的执行器，多数仓 requirements.txt 未声明它；
            # 缺失时 `python -m pytest` 直接 127，push 流水线从未真正跑过测试。
            python -m pytest --version >/dev/null 2>&1 || python -m pip install --disable-pip-version-check pytest
            if ! command -v node >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs npm
            fi
            node --version
        - name: 推送代码到GitLab
          script: |
            # 令牌缺失时显式跳过（该仓 CNB 环境变量未配 GITLAB_TOKEN 时不得把整条 push CI 打红）
            if [ -z "$GITLAB_TOKEN" ]; then
              echo "未配置 GITLAB_TOKEN：跳过 GitLab 镜像同步"
              exit 0
            fi
            # token 不入 URL/进程表：走 GIT_ASKPASS
            cat > /tmp/gl-askpass.sh <<'AASK'
            #!/bin/sh
            case "$1" in
              *sername*) echo "oauth2" ;;
              *) printf '%s' "$GITLAB_TOKEN" ;;
            esac
            AASK
            chmod +x /tmp/gl-askpass.sh
            git remote remove gitlab 2>/dev/null || true
            git remote add gitlab https://gitlab.com/xuerui911/crawl_cars.git
            if GIT_ASKPASS=/tmp/gl-askpass.sh GIT_TERMINAL_PROMPT=0 git push gitlab HEAD:refs/heads/main 2>&1; then
              echo "GITLAB_PUSH=done"
              echo "GITLAB_PUSH=done" >> _stage_context_.env
            else
              echo "⚠️ GitLab 镜像推送失败（多端镜像非必需，不阻断主流水线；令牌无效或过期请重新签发）"
              echo "GITLAB_PUSH=failed" >> _stage_context_.env
            fi
            rm -f /tmp/gl-askpass.sh
        - name: pytest
          script: |
            # PIPESTATUS 是 bash 数组，CNB runner 用 sh(dash) 执行 stage 脚本会 Bad substitution(127)。
            # POSIX 取法：子 shell 内把真实退出码落盘，`| tee` 保持 stdout 实时回显——
            # 直接重定向会让 stdout 静默，触发 CNB「10 分钟无输出强杀」（vps 仓已实证）。
            rm -f _pytest_rc_.txt
            ( set +e; python -m pytest tests/ -x --tb=short 2>&1; echo $? > _pytest_rc_.txt ) | tee _test_result_.txt
            rc=$(cat _pytest_rc_.txt)
            echo "PYTEST_EXIT=$rc" >> _stage_context_.env
            # 此前退出码取 tee 的 0，测试失败从不使流水线变红（结构性假绿），现诚实穿透
            exit "$rc"
        - name: 语法校验
          script: |
            if python -m py_compile scripts/*.py; then
              echo "SYNTAX=PASS" >> _stage_context_.env
            else
              echo "SYNTAX=FAIL" >> _stage_context_.env
              echo "❌ SYNTAX 未通过：原写法 A && echo PASS || echo FAIL 的退出码恒为 0，属结构性假绿，现改为硬失败"
              exit 1
            fi
        - name: 治理校验
          script: |
            python scripts/validate_workflow_expectations.py || echo "WARN: workflow expectations 未通过"
            python scripts/validate_plan_agent_boundary.py || echo "WARN: plan/agent 边界未通过"
            python scripts/scan_direct_llm_calls.py scripts .github || echo "WARN: 存在 LLM 直调"
      # 自愈入口：push CI 任一阶段报错即触发 NPC 免费模型修复（形状对齐 api_trigger 的 AI-修复-第1轮）。
      # 定义处（YAML 锚点），pull_request / crontab: 37 / issue.open 三条链引用同一份，避免重复拷贝漂移。
      failStages: &cars_failstages_npc_repair
        - name: 诊断-收集失败上下文
          script: &cars_failstage_diag_script |
            python - <<'PY'
            import json, os
            from pathlib import Path
            fields = ("CNB_BUILD_FAILED_STAGE_NAME", "CNB_BUILD_FAILED_MSG", "CNB_BRANCH", "CNB_COMMIT_SHORT", "CNB_BUILD_WEB_URL", "DEBUG_MODE", "RETRY_COUNT")
            context = "# 流水线失败诊断\n" + json.dumps({key: os.environ.get(key) for key in fields}, ensure_ascii=False, indent=2)
            Path("_fail_context_.md").write_text(context, encoding="utf-8")
            print("失败诊断已写入 _fail_context_.md；修复前不重跑，不提交诊断到源码分支")
            PY
        - name: AI-修复-第1轮
          type: npc:go
          timeout: 90m
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: max
            maxTurns: 120
            contextWindow: 256k
            systemPrompt: &cars_repair_system_prompt |
              你是汽车爬虫修复专家。读取 _fail_context_.md，定位实际根因并做最小修复。
              允许修复 scripts/、dongchedi/、docs/ 静态前端、config/ 的正常代码，或 .cnb.yml 正常 stages 的真实工作流 bug。
              禁止修改 tests/、任何 .test.* 或 test_* 文件、AGENTS.md、ai_tools/、provider 配置。
              禁止修改 scripts/check_npc_free_quota.py、scripts/finalize_npc_repair.py、.cnb.yml 中 failStages 安全链或 /tmp 安全检查器/快照。
              不伪造数据、不刷新无新数据时间、不折叠真冲突、不删测试和校验、不降原质量门禁。
              车系/车型身份必须完整，指导价与经销商报价分离。不得 git commit、push 或重触发。
              完成后只另写 _fix_report_.md，说明根因、实际改动和验收依据；没有改动必须说明无法修复，不冒充成功。
            userPrompt: 读取真实失败上下文并执行范围内最小修复，写 _fix_report_.md。保留所有受保护文件。
        - name: 交付核对-修复后必须真取回
          timeout: 10m
          script: |
            # 修复段之后复核：修完了必须有人再取一次产物、再判一次——否则"链的绿=交付发生"
            # 在自愈路径上仍是空的（实测 cnb-8d5-1k4socvu6：AI-修复-第1轮 success 4613s，
            # 评论仍 0、附件仍 0）。与主链核对段共用同一份实现（scripts/check_delivery_artifacts.py），
            # 禁止再抄第二份内联块（重复字面块只改一份 = 半修，第二份会被执行）。
            # 非 0 = 产物取不回或读不到 issue 号 ⇒ 不许当通过、不恒真。
            python scripts/check_delivery_artifacts.py
  api_trigger:
    # AWS cutover: native API events verify data only; processing/Pages belongs to GitHub.
    - runner:
        cpus: 1
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      timeout: 15m
      stages:
        - name: 验收AWS原始镜像（不爬取、不自驱修复）
          script: |
            python - <<'PY'
            import hashlib, json, os, re, urllib.parse, urllib.request
            TAG = os.environ.get("AWS_RAW_RELEASE", "")
            PRODUCER = os.environ.get("AWS_RAW_PRODUCER_COMMIT", "")
            if not re.fullmatch(r"aws-raw-[0-9]{8}T[0-9]{6}Z", TAG) or not re.fullmatch(r"[0-9a-f]{40}", PRODUCER):
                raise SystemExit("AWS data-only acceptance requires exact raw tag and producer commit")
            class Redirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, req, fp, code, msg, headers, url):
                    parsed = urllib.parse.urlsplit(url)
                    if parsed.scheme != "https" or parsed.username or parsed.password:
                        raise ValueError("unsafe asset redirect")
                    result = super().redirect_request(req, fp, code, msg, headers, url)
                    if result is not None:
                        result.remove_header("Authorization")
                    return result
            def get(url, maximum=209715200, binary=False):
                host = urllib.parse.urlsplit(url).hostname
                headers = {"Accept": "application/octet-stream" if binary else "application/json"}
                token = os.environ.get("CNB_TOKEN", "") if host == "api.cnb.cool" else os.environ.get("GH_TOKEN", "") if host == "api.github.com" else ""
                if token:
                    headers["Authorization"] = "Bearer " + token
                with urllib.request.build_opener(Redirect()).open(urllib.request.Request(url, headers=headers), timeout=120) as response:
                    value = response.read(maximum + 1)
                    if len(value) > maximum:
                        raise ValueError("raw asset exceeds bound")
                return value if binary else json.loads(value)
            gh = "https://api.github.com/repos/Fatty911/crawl_cars"
            canonical = get(gh + "/releases/tags/" + TAG, 1048576)
            ref = get(gh + "/git/ref/tags/" + TAG, 1048576)["object"]
            if canonical.get("draft") is not False or canonical.get("prerelease") is not True or ref.get("type") != "commit" or ref.get("sha") != PRODUCER:
                raise ValueError("canonical raw release/tag provenance mismatch")
            manifest_assets = [x for x in canonical.get("assets", []) if x.get("name") == "aws-raw-manifest.json"]
            if len(manifest_assets) != 1:
                raise ValueError("canonical raw manifest missing/ambiguous")
            manifest_bytes = get(gh + "/releases/assets/" + str(manifest_assets[0]["id"]), 8192, True)
            manifest = json.loads(manifest_bytes)
            if manifest.get("tag") != TAG or manifest.get("producer_commit") != PRODUCER or manifest.get("schema") != 1:
                raise ValueError("canonical manifest identity mismatch")
            names = {"autohome": "autoHome_aws.json", "dongchedi": "dongchedi_aws.json", "yiche": "yiche_aws.json"}
            expected = {"aws-raw-manifest.json": {"size": len(manifest_bytes), "sha256": hashlib.sha256(manifest_bytes).hexdigest()}}
            assets = manifest.get("assets", {})
            if not assets or not assets.keys() <= names.keys():
                raise ValueError("unknown/empty raw source set")
            for source, asset in assets.items():
                if asset.get("file") != names[source]:
                    raise ValueError("raw source filename mismatch")
                expected[names[source]] = {"size": asset["size"], "sha256": asset["sha256"]}
            base = "https://api.cnb.cool/xuerui911-mirror/crawl_cars/-/"
            release = get(base + "releases/tags/" + TAG, 1048576)
            binding = json.loads(release.get("body", "{}"))["aws_raw"]
            if (release.get("draft") is not False or release.get("prerelease") is not True or release.get("tag_name") != TAG
                    or binding.get("tag") != TAG or binding.get("producer_commit") != PRODUCER
                    or binding.get("storage_ref") != "main" or binding.get("assets") != expected
                    or not re.fullmatch(r"[0-9a-f]{40}", binding.get("storage_commit", ""))):
                raise ValueError("native raw mirror binding mismatch")
            if get(base + "git/tags/" + TAG, 1048576).get("commit", {}).get("sha") != binding["storage_commit"]:
                raise ValueError("native storage tag mismatch")
            remote = release.get("assets", [])
            if len(remote) != len(expected) or {x.get("name") for x in remote} != set(expected):
                raise ValueError("native raw mirror assets incomplete/foreign")
            for name, item in expected.items():
                value = get(base + "releases/download/" + TAG + "/" + name, binary=True)
                if len(value) != item["size"] or hashlib.sha256(value).hexdigest() != item["sha256"]:
                    raise ValueError("native raw mirror size/SHA mismatch")
            print(json.dumps({"tag": TAG, "producer_commit": PRODUCER, "storage_commit": binding["storage_commit"], "assets": expected}, sort_keys=True))
            PY
        - name: 验收已处理 Pages 制品
          script: |
            set -eu
            : "${AWS_PROCESSED_RELEASE:?missing processed release}"
            : "${AWS_RAW_MANIFEST_SHA256:?missing raw manifest digest}"
            python scripts/download_verified_release.py \
              --repo Fatty911/crawl_cars --tag "$AWS_PROCESSED_RELEASE" \
              --no-legacy --require-immutable --dir .aws-verified-release
            python scripts/prepare_cnb_pages.py \
              --archive .aws-verified-release/verified-site.zip \
              --manifest .aws-verified-release/manifest.json --site .aws-verified-site
            python - <<'PY'
            import json, os, re
            from pathlib import Path

            site = Path(".aws-verified-site")
            manifest = json.loads((site / "data/manifest.json").read_bytes())
            provenance = manifest.get("provenance", {})
            requirements = (
                ("awsRawRelease", "AWS_RAW_RELEASE", r"aws-raw-[0-9]{8}T[0-9]{6}Z"),
                ("awsRawProducerCommit", "AWS_RAW_PRODUCER_COMMIT", r"[0-9a-f]{40}"),
                ("awsRawManifestSha256", "AWS_RAW_MANIFEST_SHA256", r"[0-9a-f]{64}"),
            )
            for field, variable, pattern in requirements:
                expected = os.environ.get(variable, "")
                if not re.fullmatch(pattern, expected) or provenance.get(field) != expected:
                    raise ValueError("processed Pages provenance mismatch: " + field)
            for field in ("rowCount", "filteredRowCount"):
                if type(manifest.get(field)) is not int or manifest[field] <= 0:
                    raise ValueError("processed Pages dataset is empty: " + field)
            if not (site / "index.html").stat().st_size:
                raise ValueError("processed Pages index is empty")
            PY

  pull_request:
    - docker:
        image: python:3.12
      stages:
        # PR 审查链要真跑 pytest 才能验证 NPC 交付；镜像里只有解释器，没有 pytest/PyYAML。
        # 实测（PR #17 构建 cnb-nnc-1k4n28lbo）：python3 -m pytest -> No module named pytest。
        - name: install-deps
          script: &cars_python_env_install_deps |
            set -e
            python -V
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pytest --version >/dev/null 2>&1 || python -m pip install --disable-pip-version-check pytest
            python -m pytest --version
            # tests/test_scan_pages_columns.py 会真跑 node 扫页脚本（Issue 取证日志里 node 也缺）；
            # 与 main.push 的 install-deps 同款装法，缺 node 时整套判据仍有 5 条跑不起来。
            if ! command -v node >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs npm
            fi
            node --version
        - name: NPC-PR审查
          type: npc:go
          timeout: 30m
          options:
            model: glm-5.3-flash
            thinkingLevel: high
            maxTurns: 150
            systemPrompt: |
              你是代码审查员。审查PR：车系身份完整、报价字段分离、merge门禁、测试断言同步。
              给出 PASS 或 FAIL 及理由。
            userPrompt: 审查本次 PR 的代码变更。
        # 原稿在此挂 CF/Codeberg 部署（且部署无数据的 docs/）——GitHub 的 deploy-frontend.yml 不由 PR 触发，
        # PR 部署会用空数据覆盖生产站点，故移除；发布统一走 crontab 数据链（site/ 含数据）。
      # 自愈入口：PR 审查链报错时也触发 NPC 修复（只加 failStages，不动 stages 与顺序）。
      failStages: *cars_failstages_npc_repair

$:
  issue.open:
    - docker:
        image: python:3.12
      stages:
        # 真闸：无 fix 标签时把结论经 exports 交出去（SKIP），下游 agent 段据此 skipped；
        # 禁止退回 `|| exit 0` 之类吞失败的恒通过形状。
        - name: 检查fix标签
          script: |
            case ",${CNB_ISSUE_LABELS:-}," in
              *,fix,*)
                echo "##[set-output fix_gate=RUN]"
                ;;
              *)
                echo "##[set-output fix_gate=SKIP]"
                echo "Issue 无 fix 标签：本轮不派发 NPC（下游段显示为 skipped，而不是跑了却什么都不做）"
                ;;
            esac
          exports:
            fix_gate: NPC_FIX_GATE
        # 默认构建镜像无 python：14 次 issue 运行里 agent 跑不了任何判据，只能读代码。
        # 装依赖失败必须让链变红（不加 || true / || exit 0）：静默的失败会让下游重新报绿。
        - name: install-deps
          script: *cars_python_env_install_deps
        - name: AI-Issue驱动修复
          if: '[ "$NPC_FIX_GATE" = "RUN" ]'
          type: npc:go
          timeout: 3h
          options:
            model: deepseek-v4.1-flash
            thinkingLevel: max
            maxTurns: 150
            contextWindow: 256k
            systemPrompt: |
              你是自动化修复 Agent。读取 Issue，理解需求，读代码定位，修改，运行 pytest，创建 PR。
              规则：不伪造数据、不折叠真冲突、不删校验、不降防护
            userPrompt: |
              Issue 标题: $CNB_ISSUE_TITLE
              Issue 描述: $CNB_ISSUE_DESCRIPTION
        - name: 交付核对-产物必须真取回
          if: '[ "$NPC_FIX_GATE" = "RUN" ]'
          script: |
            # 交付核对：agent 阶段 success 只代表会话结束，不代表有东西可交付——
            # 实测 cnb-fs9/trs/13k 三条阶段绿、零分支零产物；#59 更直接：交付评论声称附件
            # "已回读 cmp 逐字节一致"，监工侧 4 个地址（2 patch + 2 bundle）逐个取，全部失败。
            # 本段不看声明：去 Issue 评论（comments 通道）里把产物链接（含 _fix_report_.md 附件）
            # 真取一次，HTTP 200 且 ≥64 字节才算交付；零产物的死因（no-comments /
            # artifact-unreachable）由脚本点名——agent 单次输出超限被截停在写盘之前
            # （finish with length，不带 error，只认 maxTurns 会漏）同样是零产物。
            # 已知坑：curl -sSfL 带 Authorization 跟随重定向会把凭据带给存储端（401，监工实测），
            # 脚本内用 python urllib 的 urlopen 家族取（禁掉自动跳转：首跳带凭据、之后每跳不带）。
            # 核对逻辑只有一份物理实现：scripts/check_delivery_artifacts.py——自愈链的
            # "交付核对-修复后必须真取回"段调用同一脚本，禁止再出现第二份内联字面块。
            # issue 号优先取 CNB_ISSUE_NUMBER；本平台 issue.open 环境实测只有 CNB_ISSUE_IID；
            # 两者都读不到时脚本报 no-issue-number 退非 0（核对没有发生，不许当通过）。
            rc=0
            python scripts/check_delivery_artifacts.py --issue "${CNB_ISSUE_NUMBER:-${CNB_ISSUE_IID:-}}" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "交付核对失败：最新评论里的产物一个也取不回来 ⇒ 链判红（候选地址与 HTTP 读数见上）"
              exit 1
            fi
      failStages: *cars_failstages_npc_repair
