name: 易车爬虫
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '触发来源'
        required: false
        default: 'manual'
      trigger_time:
        description: '触发时间戳'
        required: false
        default: ''
      run_profile:
        description: '运行时长配置：auto/morning/afternoon'
        required: false
        default: 'auto'
      max_series:
        description: '最多爬取车系 URL 数（调试用，0=不限制）'
        required: false
        default: '0'
      debug_mode:
        description: '调试模式：只验证配置的少量易车 URL'
        required: false
        default: 'false'
      resume_run_id:
        description: '显式恢复来源 run ID（与其余恢复字段全有或全无）'
        required: false
        default: ''
      resume_artifact_id:
        description: '显式恢复 checkpoint artifact ID'
        required: false
        default: ''
      resume_artifact_sha256:
        description: 'checkpoint artifact ZIP SHA-256'
        required: false
        default: ''
      resume_checkpoint_sha256:
        description: 'artifact 内 yiche_checkpoint.json SHA-256'
        required: false
        default: ''
      source_head_sha:
        description: '恢复来源完整 head SHA'
        required: false
        default: ''
      resume_smoke_targets:
        description: '恢复烟测新增目标数（0=正式续跑，1-10=仅 checkpoint 烟测）'
        required: false
        default: '0'
  repository_dispatch:
    types: [trigger-yiche]

env:
  RUN_TIME: 10800
  MORNING_RUN_TIME: 10800
  AFTERNOON_RUN_TIME: 21000
  MAX_WORKFLOW_SECONDS: 21600
  PROGRESS_COMMIT_BUFFER_SECONDS: 1800
  WINDOW_END_BUFFER_SECONDS: 900
  CRAWL_MIN_DELAY_SECONDS: 3
  CRAWL_MAX_DELAY_SECONDS: 8
  YICHE_ITEM_TIMEOUT_SECONDS: 120
  YICHE_HEARTBEAT_INTERVAL_SECONDS: 60
  YICHE_CHECKPOINT_PATH: yiche_checkpoint.json
  MAX_SERIES: ${{ github.event.inputs.max_series || '0' }}
  RESUME_SMOKE_TARGETS: ${{ github.event.inputs.resume_smoke_targets || '0' }}

concurrency:
  group: yiche-crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  yiche-crawl:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Configure crawl window
        id: window
        env:
          PROFILE_INPUT: ${{ github.event.inputs.run_profile || github.event.client_payload.run_profile || 'auto' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        run: |
          echo "WORKFLOW_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          if [ "$DEBUG_MODE" = "true" ]; then
            echo "调试模式：跳过时间窗口检查"
            DEBUG_LIMIT="${{ github.event.inputs.max_series || '0' }}"
            if ! [[ "$DEBUG_LIMIT" =~ ^[0-9]+$ ]] || [ "$DEBUG_LIMIT" -gt 50 ]; then
              echo "错误: debug max_series 必须是 0 到 50 的整数（0 表示不限制）"
              exit 1
            fi
            echo "MAX_SERIES=$DEBUG_LIMIT" >> "$GITHUB_ENV"
            echo "DEBUG_MODE=true" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/crawl_budget.py configure
            MAX_SERIES_INPUT="${{ github.event.inputs.max_series || '0' }}"
            echo "MAX_SERIES=$MAX_SERIES_INPUT" >> "$GITHUB_ENV"
            echo "DEBUG_MODE=false" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.window.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: 安装依赖
        if: steps.window.outputs.skip != 'true'
        run: pip install requests beautifulsoup4 lxml PyYAML

      - name: Restore authenticated Yiche checkpoint
        if: steps.window.outputs.skip != 'true'
        env:
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id || '' }}
          RESUME_ARTIFACT_ID: ${{ github.event.inputs.resume_artifact_id || '' }}
          RESUME_ARTIFACT_SHA256: ${{ github.event.inputs.resume_artifact_sha256 || '' }}
          RESUME_CHECKPOINT_SHA256: ${{ github.event.inputs.resume_checkpoint_sha256 || '' }}
          RESUME_SOURCE_HEAD_SHA: ${{ github.event.inputs.source_head_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fields=("$RESUME_RUN_ID" "$RESUME_ARTIFACT_ID" "$RESUME_ARTIFACT_SHA256" "$RESUME_CHECKPOINT_SHA256" "$RESUME_SOURCE_HEAD_SHA")
          populated=0
          AUTO_RESUME=false
          for value in "${fields[@]}"; do
            [ -n "$value" ] && populated=$((populated + 1))
          done
          if ! [[ "$RESUME_SMOKE_TARGETS" =~ ^([0-9]|10)$ ]]; then
            echo "错误: resume_smoke_targets 必须是 0 到 10 的整数"
            exit 1
          fi
          if [ "$populated" -eq 0 ]; then
            AUTO_RESUME=true
            echo "未提供显式恢复身份，查找最近成功且兼容的易车 checkpoint"
            mapfile -t CANDIDATE_RUNS < <(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/crawl-yiche.yml/runs?status=success&per_page=100" --paginate \
                --jq '.workflow_runs[] | [.id, .run_attempt, .head_sha, .path, .head_repository.full_name, .status, .conclusion] | @tsv'
            )
            for candidate in "${CANDIDATE_RUNS[@]}"; do
              IFS=$'\t' read -r CANDIDATE_RUN_ID CANDIDATE_ATTEMPT CANDIDATE_HEAD CANDIDATE_PATH CANDIDATE_REPO CANDIDATE_STATUS CANDIDATE_CONCLUSION <<< "$candidate"
              CANDIDATE_PATH="${CANDIDATE_PATH%%@*}"
              if [ "$CANDIDATE_RUN_ID" = "$GITHUB_RUN_ID" ] \
                 || [ "$CANDIDATE_PATH" != ".github/workflows/crawl-yiche.yml" ] \
                 || [ "$CANDIDATE_REPO" != "$GITHUB_REPOSITORY" ] \
                 || [ "$CANDIDATE_STATUS" != "completed" ] \
                 || [ "$CANDIDATE_CONCLUSION" != "success" ] \
                 || ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ && "$CANDIDATE_ATTEMPT" =~ ^[0-9]+$ && "$CANDIDATE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
                continue
              fi
              git merge-base --is-ancestor "$CANDIDATE_HEAD" "$GITHUB_SHA" || continue
              EXPECTED_CHECKPOINT="yiche-checkpoint-$CANDIDATE_RUN_ID-$CANDIDATE_ATTEMPT"
              mapfile -t CANDIDATE_ARTIFACTS < <(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
                  --jq ".artifacts[] | select(.expired == false and .name == \"$EXPECTED_CHECKPOINT\") | [.id, .digest] | @tsv"
              )
              if [ "${#CANDIDATE_ARTIFACTS[@]}" -gt 1 ]; then
                echo "警告: 最近候选 run=$CANDIDATE_RUN_ID 的 checkpoint artifact 不唯一，拒绝自动恢复"
                break
              elif [ "${#CANDIDATE_ARTIFACTS[@]}" -eq 0 ]; then
                continue
              fi
              IFS=$'\t' read -r CANDIDATE_ARTIFACT_ID CANDIDATE_DIGEST <<< "${CANDIDATE_ARTIFACTS[0]}"
              if ! [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[0-9]+$ && "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
                echo "警告: run=$CANDIDATE_RUN_ID 的 checkpoint digest 非法，继续查找"
                continue
              fi
              RESUME_RUN_ID="$CANDIDATE_RUN_ID"
              RESUME_ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
              RESUME_ARTIFACT_SHA256="${CANDIDATE_DIGEST#sha256:}"
              RESUME_SOURCE_HEAD_SHA="${CANDIDATE_HEAD,,}"
              echo "自动恢复候选: run=$RESUME_RUN_ID attempt=$CANDIDATE_ATTEMPT artifact=$RESUME_ARTIFACT_ID head=$RESUME_SOURCE_HEAD_SHA"
              break
            done
            if [ -z "$RESUME_RUN_ID" ]; then
              if [ "$RESUME_SMOKE_TARGETS" != "0" ]; then
                echo "错误: 自动恢复烟测未找到可认证 checkpoint"
                exit 1
              fi
              echo "未找到可认证 checkpoint，本次从头开始"
              exit 0
            fi
          fi
          if { [ "$AUTO_RESUME" != "true" ] && [ "$populated" -ne 5 ]; } \
             || ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || ! [[ "$RESUME_ARTIFACT_ID" =~ ^[0-9]+$ ]] \
             || ! [[ "$RESUME_ARTIFACT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] \
             || { [ "$AUTO_RESUME" != "true" ] && ! [[ "$RESUME_CHECKPOINT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; } \
             || ! [[ "$RESUME_SOURCE_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "错误: Yiche 恢复输入缺失或格式非法"
            exit 1
          fi
          git merge-base --is-ancestor "$RESUME_SOURCE_HEAD_SHA" "$GITHUB_SHA" || {
            echo "错误: 恢复来源 head 不是当前 head 的祖先"
            exit 1
          }
          source_crawler_sha256="$(git show "$RESUME_SOURCE_HEAD_SHA:scripts/crawl_yiche.py" | sha256sum | cut -d' ' -f1)"
          resume_dir="$RUNNER_TEMP/yiche-resume"
          mkdir -p "$resume_dir"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$RESUME_ARTIFACT_ID" \
            -o "$resume_dir/artifact.json"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" \
            -o "$resume_dir/run.json"
          python - "$resume_dir" <<'PY'
          import json
          import os
          import sys
          base = sys.argv[1]
          artifact = json.load(open(os.path.join(base, "artifact.json"), encoding="utf-8"))
          run = json.load(open(os.path.join(base, "run.json"), encoding="utf-8"))
          expected_name = f"yiche-checkpoint-{os.environ['RESUME_RUN_ID']}-{run['run_attempt']}"
          failures = []
          if str(artifact.get("id")) != os.environ["RESUME_ARTIFACT_ID"]:
              failures.append("artifact_id")
          if artifact.get("name") != expected_name or artifact.get("expired"):
              failures.append("artifact_name_or_expiry")
          workflow_run = artifact.get("workflow_run") or {}
          if str(workflow_run.get("id")) != os.environ["RESUME_RUN_ID"]:
              failures.append("artifact_run_id")
          if workflow_run.get("head_sha") != os.environ["RESUME_SOURCE_HEAD_SHA"]:
              failures.append("artifact_head_sha")
          if workflow_run.get("repository_id") != (run.get("repository") or {}).get("id"):
              failures.append("artifact_repository_id")
          if artifact.get("digest") != f"sha256:{os.environ['RESUME_ARTIFACT_SHA256'].lower()}":
              failures.append("artifact_digest")
          if str(run.get("id")) != os.environ["RESUME_RUN_ID"] or run.get("head_sha") != os.environ["RESUME_SOURCE_HEAD_SHA"]:
              failures.append("run_identity")
          if (
              (run.get("repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              failures.append("run_repository_or_status")
          if str(run.get("path", "")).split("@", 1)[0] != ".github/workflows/crawl-yiche.yml":
              failures.append("workflow_path")
          if failures:
              raise SystemExit(f"Yiche 恢复来源身份不匹配: {failures}")
          PY
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$RESUME_ARTIFACT_ID/zip" \
            -o "$resume_dir/checkpoint.zip"
          echo "$RESUME_ARTIFACT_SHA256  $resume_dir/checkpoint.zip" | sha256sum --check --strict
          python - "$resume_dir" <<'PY'
          import hashlib
          import os
          import stat
          import sys
          import zipfile
          base = sys.argv[1]
          archive = os.path.join(base, "checkpoint.zip")
          output = os.path.join(base, "yiche_checkpoint.json")
          with zipfile.ZipFile(archive) as source:
              members = source.infolist()
              if len(members) != 1 or members[0].filename != "yiche_checkpoint.json":
                  raise SystemExit("Yiche checkpoint archive 成员不唯一或名称非法")
              mode = members[0].external_attr >> 16
              if stat.S_ISLNK(mode) or members[0].file_size > 128 * 1024 * 1024:
                  raise SystemExit("Yiche checkpoint archive 类型或大小非法")
              content = source.read(members[0])
          digest = hashlib.sha256(content).hexdigest()
          with open(output, "xb") as target:
              target.write(content)
          with open(os.path.join(base, "checkpoint.sha256"), "w", encoding="ascii") as target:
              target.write(digest)
          PY
          ACTUAL_CHECKPOINT_SHA256="$(cat "$resume_dir/checkpoint.sha256")"
          if [ "$AUTO_RESUME" = "true" ]; then
            RESUME_CHECKPOINT_SHA256="$ACTUAL_CHECKPOINT_SHA256"
          elif [ "$ACTUAL_CHECKPOINT_SHA256" != "${RESUME_CHECKPOINT_SHA256,,}" ]; then
            echo "Yiche checkpoint JSON SHA256 mismatch"
            exit 1
          fi
          if ! AUTO_RESUME="$AUTO_RESUME" SOURCE_CRAWLER_SHA256="$source_crawler_sha256" python - "$resume_dir/yiche_checkpoint.json" <<'PY'
          import json
          import os
          import sys
          from scripts.crawl_yiche import load_resume_checkpoint

          checkpoint_path = sys.argv[1]
          with open(checkpoint_path, "r", encoding="utf-8") as source:
              payload = json.load(source)
          if os.environ["AUTO_RESUME"] == "true" and payload.get("status") != "partial":
              raise ValueError("自动恢复只接受 partial checkpoint")
          load_resume_checkpoint(
              checkpoint_path,
              source_run_id=os.environ["RESUME_RUN_ID"],
              source_artifact_id=os.environ["RESUME_ARTIFACT_ID"],
              source_artifact_sha256=os.environ["RESUME_ARTIFACT_SHA256"].lower(),
              source_checkpoint_sha256=os.environ["RESUME_CHECKPOINT_SHA256"].lower(),
              source_head_sha=os.environ["RESUME_SOURCE_HEAD_SHA"].lower(),
              source_crawler_sha256=os.environ["SOURCE_CRAWLER_SHA256"],
          )
          PY
          then
            if [ "$AUTO_RESUME" = "true" ] && [ "$RESUME_SMOKE_TARGETS" = "0" ]; then
              echo "自动恢复候选不兼容，本次从头开始"
              exit 0
            fi
            echo "错误: 易车 checkpoint 兼容性验证失败"
            exit 1
          fi
          {
            echo "YICHE_RESUME_CHECKPOINT=$resume_dir/yiche_checkpoint.json"
            echo "YICHE_RESUME_RUN_ID=$RESUME_RUN_ID"
            echo "YICHE_RESUME_ARTIFACT_ID=$RESUME_ARTIFACT_ID"
            echo "YICHE_RESUME_ARTIFACT_SHA256=${RESUME_ARTIFACT_SHA256,,}"
            echo "YICHE_RESUME_CHECKPOINT_SHA256=${RESUME_CHECKPOINT_SHA256,,}"
            echo "YICHE_RESUME_SOURCE_HEAD_SHA=${RESUME_SOURCE_HEAD_SHA,,}"
            echo "YICHE_RESUME_SOURCE_CRAWLER_SHA256=$source_crawler_sha256"
          } >> "$GITHUB_ENV"
          echo "易车恢复来源已认证: auto=$AUTO_RESUME run=$RESUME_RUN_ID artifact=$RESUME_ARTIFACT_ID head=${RESUME_SOURCE_HEAD_SHA,,}"

      - name: Setup environment
        if: steps.window.outputs.skip != 'true'
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Setup proxy if configured
        if: steps.window.outputs.skip != 'true'
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: python scripts/setup_proxy_runtime.py --github-env "$GITHUB_ENV" --test-url "https://car.yiche.com/"

      - name: Clamp runtime to workflow budget
        if: steps.window.outputs.skip != 'true' && github.event.inputs.debug_mode != 'true'
        run: python scripts/crawl_budget.py clamp --step-label yiche --skip-env YICHE_SKIP

      - name: 运行易车爬虫
        id: crawl_yiche
        if: steps.window.outputs.skip != 'true'
        env:
          YICHE_SERIES_URLS: ${{ vars.YICHE_SERIES_URLS }}
          YICHE_DISCOVERY_URLS: ${{ vars.YICHE_DISCOVERY_URLS }}
        run: |
          if [ "${YICHE_SKIP:-false}" = "true" ]; then
            echo "易车爬虫已因剩余安全时间不足跳过"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${PROXY_ENABLED:-false}" = "true" ]; then
            echo "使用代理模式运行易车爬虫 (mihomo round-robin)"
          else
            echo "无代理，直接运行易车爬虫"
          fi
          echo "易车运行约束: workflow_timeout=390m RUN_TIME=${RUN_TIME}s 北京时间窗口=08:00-12:30/13:00-22:00 安全收尾缓冲=${WINDOW_END_BUFFER_SECONDS}s"
          echo "易车预计 deadline_utc=$(date -u -d "+${RUN_TIME} seconds" --iso-8601=seconds)"
          YICHE_OUTPUT_PATH="yiche_$(date +%Y%m%d).json"
          echo "YICHE_OUTPUT_PATH=$YICHE_OUTPUT_PATH" >> "$GITHUB_ENV"
          resume_args=()
          series_args=(--max-series "$MAX_SERIES")
          if [ -n "${YICHE_RESUME_CHECKPOINT:-}" ]; then
            series_args=()
            resume_args=(
              --resume-checkpoint "$YICHE_RESUME_CHECKPOINT"
              --resume-source-run-id "$YICHE_RESUME_RUN_ID"
              --resume-source-artifact-id "$YICHE_RESUME_ARTIFACT_ID"
              --resume-source-artifact-sha256 "$YICHE_RESUME_ARTIFACT_SHA256"
              --resume-source-checkpoint-sha256 "$YICHE_RESUME_CHECKPOINT_SHA256"
              --resume-source-head-sha "$YICHE_RESUME_SOURCE_HEAD_SHA"
              --resume-source-crawler-sha256 "$YICHE_RESUME_SOURCE_CRAWLER_SHA256"
              --resume-smoke-targets "$RESUME_SMOKE_TARGETS"
            )
          fi
          forward_crawler_signal() {
            local signal_name="$1"
            local exit_code="$2"
            kill "-$signal_name" "$crawler_pid" 2>/dev/null || true
            wait "$crawler_pid" || true
            exit "$exit_code"
          }
          python scripts/crawl_yiche.py --time-limit "$RUN_TIME" "${series_args[@]}" \
            --output "$YICHE_OUTPUT_PATH" "${resume_args[@]}" &
          crawler_pid=$!
          trap 'forward_crawler_signal INT 130' INT
          trap 'forward_crawler_signal TERM 143' TERM
          if wait "$crawler_pid"; then
            crawler_status=0
          else
            crawler_status=$?
          fi
          trap - INT TERM
          if [ "$crawler_status" -ne 0 ]; then
            exit "$crawler_status"
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Disable proxy for Yiche checkpoint upload
        if: always()
        run: |
          {
            echo "HTTP_PROXY="
            echo "HTTPS_PROXY="
            echo "ALL_PROXY="
            echo "http_proxy="
            echo "https_proxy="
            echo "all_proxy="
          } >> "$GITHUB_ENV"

      - name: 上传易车检查点
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yiche-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: yiche_checkpoint.json
          if-no-files-found: warn
          retention-days: 3

      - name: 校验易车输出
        id: verify_yiche
        if: steps.window.outputs.skip != 'true' && steps.crawl_yiche.outputs.skipped != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          path = os.environ.get("YICHE_OUTPUT_PATH", "")
          name_match = re.fullmatch(r"yiche_(\d{8})\.json", os.path.basename(path))
          if not name_match or not os.path.isfile(path):
              raise SystemExit("未生成精确命名的易车数据文件，拒绝上传 artifact")
          with open(path, "r", encoding="utf-8") as f:
              rows = json.load(f)
          from scripts.crawl_yiche import validate_real_rows
          real_rows = validate_real_rows(rows)
          if len(real_rows) != len(rows) or not real_rows:
              raise SystemExit(f"易车质量门禁失败: total={len(rows)} real_config_rows={len(real_rows)}，拒绝上传 artifact 和触发 merge")
          config_fields = {key for row in real_rows for key in row if key not in {"车系", "车型名称", "品牌", "年款", "数据来源"}}
          if not config_fields:
              raise SystemExit("易车质量门禁失败: 配置字段覆盖为 0")
          with open(os.environ["YICHE_CHECKPOINT_PATH"], "r", encoding="utf-8") as f:
              checkpoint = json.load(f)
          stable_ready = checkpoint.get("status") == "completed"
          if stable_ready:
              artifact_name = f"yiche-data-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          else:
              artifact_name = (
                  f"yiche-partial-data-{name_match.group(1)}-"
                  f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              )
          print(f"{path}: total={len(rows)} real_config_rows={len(real_rows)} config_fields={len(config_fields)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"row_count={len(real_rows)}\n")
              f.write("has_data=true\n")
              f.write(f"data_path={path}\n")
              f.write(f"stable_ready={'true' if stable_ready else 'false'}\n")
              f.write(f"artifact_name={artifact_name}\n")
          PY

      - name: Disable proxy for Yiche artifact upload
        if: steps.verify_yiche.outputs.has_data == 'true'
        run: |
          {
            echo "HTTP_PROXY="
            echo "HTTPS_PROXY="
            echo "ALL_PROXY="
            echo "http_proxy="
            echo "https_proxy="
            echo "all_proxy="
          } >> "$GITHUB_ENV"

      - name: 上传易车 artifact
        id: upload_yiche
        if: steps.verify_yiche.outputs.has_data == 'true' && (steps.verify_yiche.outputs.stable_ready != 'true' || env.RESUME_SMOKE_TARGETS == '0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.verify_yiche.outputs.artifact_name }}
          path: ${{ steps.verify_yiche.outputs.data_path }}
          if-no-files-found: error
          retention-days: 3


      - name: Trigger merge-and-filter workflow
        if: steps.upload_yiche.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT }}
        run: |
          MERGE_DEBUG_MODE="${DEBUG_MODE:-false}"
          if [ "$MERGE_DEBUG_MODE" != "true" ] && [ "${MAX_SERIES:-0}" != "0" ]; then
            MERGE_DEBUG_MODE=true
          fi
          gh workflow run merge-and-filter.yml \
            --repo ${{ github.repository }} \
            --ref "${{ github.ref_name }}" \
            -f mode=merge_and_deploy \
            -f force_merge=false \
            -f debug_mode="$MERGE_DEBUG_MODE" \
            -f crawler_run_id=${{ github.run_id }} \
            -f crawler_run_attempt=${{ github.run_attempt }} \
            -f trigger_source=yiche-crawl \
            -f trigger_time=$(date +%s)
