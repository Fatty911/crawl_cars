name: Deploy verified CNB Pages

on:
  workflow_run:
    workflows: ["重合并并发布（不爬取）", "部署前端展示"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact verified cnb-data-* build; empty resolves newest complete build"
        required: false
        type: string
        default: ""

      target:
        description: "Publish both sites or rerun one site only"
        required: false
        type: choice
        default: both
        options: [both, github, cloudflare]

permissions:
  contents: read
  actions: read

jobs:
  resolve_release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      release_tag: ${{ steps.pin.outputs.release_tag }}
      manifest_sha256: ${{ steps.pin.outputs.manifest_sha256 }}
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Pin the verified release and manifest
        id: pin
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TARGET" && "$REQUESTED_TARGET" != both && -z "$REQUESTED_TAG" ]]; then
            echo "release_tag is required when publishing a single target" >&2
            exit 1
          fi
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" --tag "$REQUESTED_TAG" --dir pinned --pattern manifest.json --no-legacy
          printf 'release_tag=%s\n' "$(cat pinned/selected-release.txt)" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$(sha256sum pinned/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve_release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && (github.event_name != 'workflow_dispatch' || inputs.target != 'cloudflare') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
      RELEASE_MANIFEST_SHA256: ${{ needs.resolve_release.outputs.manifest_sha256 }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Check platform-independent saved-artifact contracts
        run: |
          set -euo pipefail
          python -m pip install requests pyyaml pytest
          python -m pytest -q tests/test_download_verified_release.py tests/test_pages_asset_readback.py tests/test_workflow_pages_env_ref_guard.py tests/test_cnb_pages_publication_authorization.py
          node --check docs/app.js
          python scripts/check_red_channel_coverage.py
          python -B -I scripts/validate_storage_policy.py --check-head

      - name: Download and verify the pinned site
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_MANIFEST_SHA256"
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dir release --no-legacy
          printf '%s  %s\n' "$RELEASE_MANIFEST_SHA256" release/manifest.json | sha256sum --check -

      - name: Validate and extract verified payload
        run: python scripts/prepare_cnb_pages.py --archive release/verified-site.zip --manifest release/manifest.json --site cnb-site

      - name: Use reviewed frontend while retaining the complete verified data
        run: python scripts/overlay_pages_frontend.py --site cnb-site --manifest release/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: cnb-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@main

      - name: Verify deployed manifest
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/prepare_cnb_pages.py --site cnb-site --verify-url "$PAGE_URL" --verify-data


  deploy_cloudflare:
    needs: resolve_release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && (github.event_name != 'workflow_dispatch' || inputs.target != 'github') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.release_tag }}
      RELEASE_MANIFEST_SHA256: ${{ needs.resolve_release.outputs.manifest_sha256 }}
    concurrency:
      group: cloudflare-pages-crawl-cars-production
      cancel-in-progress: false
    # Match the original job's secret scope and existing deployment protections.
    environment:
      name: github-pages
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Set up Node for existing Cloudflare upload
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check platform-independent saved-artifact contracts
        run: |
          set -euo pipefail
          python -m pip install requests pyyaml pytest
          python -m pytest -q tests/test_download_verified_release.py tests/test_pages_asset_readback.py tests/test_workflow_pages_env_ref_guard.py tests/test_cnb_pages_publication_authorization.py
          node --check docs/app.js
          python scripts/check_red_channel_coverage.py
          python -B -I scripts/validate_storage_policy.py --check-head

      - name: Download and verify the pinned site
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_MANIFEST_SHA256"
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dir release --no-legacy
          printf '%s  %s\n' "$RELEASE_MANIFEST_SHA256" release/manifest.json | sha256sum --check -

      - name: Validate and extract verified payload
        run: python scripts/prepare_cnb_pages.py --archive release/verified-site.zip --manifest release/manifest.json --site cnb-site

      - name: Use reviewed frontend while retaining the complete verified data
        run: python scripts/overlay_pages_frontend.py --site cnb-site --manifest release/manifest.json

      - name: Check Cloudflare packaging and publication
        run: python -m pytest -q tests/test_prepare_cloudflare_payload.py tests/test_cloudflare_saved_workflow.py

      - name: 保留数据原件并无损封装Cloudflare发布面
        run: |
          set -euo pipefail
          python scripts/prepare_cloudflare_payload.py --input cnb-site --output cf-site
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from prepare_cnb_pages import checked_assets
          manifest_path = Path('cf-site/data/manifest.json')
          manifest = json.loads(manifest_path.read_bytes())
          manifest['publication'] = {
              'platform': 'cloudflare-pages',
              'project': 'crawl-cars',
              'postprocessCodeCommit': os.environ['GITHUB_SHA'],
              'sourceVerifiedRelease': Path('release/selected-release.txt').read_text().strip(),
              'sourceManifestSha256': hashlib.sha256(Path('release/manifest.json').read_bytes()).hexdigest(),
              'frontendAppSha256': hashlib.sha256(Path('cf-site/app.js').read_bytes()).hexdigest(),
          }
          checked_assets(Path('cf-site'), manifest)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: 发布到既有crawl-cars生产项目
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import os, requests
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          response = requests.get(
              'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/crawl-cars',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']}, timeout=30)
          assert response.status_code == 200, 'Cloudflare project metadata could not be verified'
          data = response.json()
          assert data.get('success') is True, 'Cloudflare project metadata rejected'
          project = data['result']
          assert project['name'] == 'crawl-cars' and project['production_branch'] == 'main'
          assert 'cars2.jiucai.eu.org' in project.get('domains', []), 'Wrong Cloudflare target domain'
          print('Verified existing crawl-cars production main and exact cars2 domain')
          PY
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/cf-site" --project-name crawl-cars --branch main --commit-hash "$GITHUB_SHA"
      - name: 全量回读cars2清单和全部实际资产
        run: |
          set -euo pipefail
          python scripts/prepare_cnb_pages.py --site cf-site --verify-url https://cars2.jiucai.eu.org/ --verify-data
      - name: 保留本轮完整Cloudflare发布制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-saved-${{ github.run_id }}
          path: cf-site/
          if-no-files-found: error
          retention-days: 3
