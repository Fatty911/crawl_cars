name: Runtime proxy cache guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test the offline publication barriers
        run: python3 -B -I tests/test_proxy_cache_privacy.py -v
      - name: Reject runtime proxy caches in index and raw HEAD
        run: python3 -B -I scripts/validate_storage_policy.py --proxy-cache-only --check-head
      - name: Check the existing storage contract
        run: python3 -B -I scripts/validate_storage_policy.py --check-head
