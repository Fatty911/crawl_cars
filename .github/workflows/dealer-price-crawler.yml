name: 经销商报价增量爬虫

on:
  schedule:
    # 每 8 小时（UTC 01:23/09:23/17:23 = 北京 09:23/17:23/01:23）
    - cron: "23 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dealer-price-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.ACTION_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - run: pip install requests -q

      - name: 机场代理（爬虫出口铁律）
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: |
          python scripts/setup_proxy_runtime.py --github-env "$GITHUB_ENV" || echo "代理不可用，尝试直连"

      - name: 下载线上车型清单（车系ID 来源）
        run: |
          # 自建站点直连（机场代理会破坏到 jiucai.eu.org 的连接）
          curl -sL --noproxy '*' --max-time 240 https://cars.jiucai.eu.org/data/latest.json -o /tmp/latest.json
          test -s /tmp/latest.json

      - name: 增量爬取经销商报价（懂车帝 garage，不重爬全量）
        run: python scripts/crawl_dealer_prices.py --series-input /tmp/latest.json --min-rows 300 --delay 0.3

      - name: 提交报价数据
        id: commit
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/dealer_prices.json)" ]; then
            git config user.name "Fatty911"
            git config user.email "xuerui911@gmail.com"
            git add data/dealer_prices.json
            git commit -m "chore: refresh dealer prices [dealer-price-crawler]" || true
            git pull --rebase --autostash origin main 2>/dev/null || true
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "报价无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发部署（报价更新生效）
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge-and-filter.yml -f mode=deploy_and_audit
