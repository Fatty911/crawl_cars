name: 部署车型配置网页

concurrency:
  group: pages-deploy-chain
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - config/filter_conditions.json
      - scripts/prepare_pages_payload.py
      - scripts/publish_identity.py
      - scripts/verify_publish_superset.py
      - scripts/audit_pages_payload.py
      - scripts/prepare_debug_merge_inputs.py
      - scripts/preserve_publish_baseline.py
      - scripts/filter_pages_source_baseline.py
      - scripts/download_latest_crawler_artifact.py
      - scripts/analysis/merge_evidence_report.py
      - scripts/analyze_single_source.py
      - scripts/column_name_diagnostics.py
      - scripts/llm_single_source_audit.py
      - scripts/crawl_zero_to_whole_ratio.py
      - scripts/merge_data.py
      - scripts/test_autohome.py
      - scripts/crawl_dongchedi.py
      - scripts/crawl_yiche.py
      - .github/workflows/merge-and-filter.yml
      - .github/workflows/crawl-autohome.yml
      - .github/workflows/crawl-dongchedi.yml
      - .github/workflows/crawl-yiche.yml
  workflow_dispatch:
    inputs:
      force_merge:
        description: '强制重新合并'
        required: false
        default: 'false'
      trigger_source:
        description: '触发来源'
        required: false
        default: 'manual'
      trigger_time:
        description: '触发时间戳'
        required: false
        default: ''
      debug_mode:
        description: '是否合并指定爬虫 run 的 debug artifact'
        required: false
        default: 'false'
      crawler_run_id:
        description: 'debug 爬虫 workflow run ID'
        required: false
        default: ''
      crawler_run_attempt:
        description: 'debug 爬虫 workflow run attempt'
        required: false
        default: ''
      release_tag:
        description: '部署模式下精确部署的 Release tag；留空时自动选择'
        required: false
        default: ''
      mode:
        description: '执行模式'
        required: false
        type: choice
        options:
          - merge_and_deploy
          - deploy_and_audit
          - deploy_only
          - audit_only
        default: merge_and_deploy

permissions: {}

jobs:
  merge-data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'merge_and_deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      crawl_date: ${{ steps.date.outputs.date }}
      ready: ${{ steps.validate.outputs.ready }}
      crawl_time: ${{ steps.date.outputs.time }}
      release_tag: ${{ steps.date.outputs.release_tag }}
      debug_mode: ${{ github.event.inputs.debug_mode || 'false' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 设置Python环境
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: 安装合并依赖
        run: pip install requests beautifulsoup4 lxml pdfplumber pypdf

      - name: 强制重新合并
        if: github.event.inputs.force_merge == 'true'
        run: |
          echo "强制重新合并，清理旧数据文件..."
          rm -f autoHome_*.json dongchedi_*.json merged_*.csv diff_*.csv filtered_cars_*.csv filtered_cars_*.json

      - name: 下载最新爬虫数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          CRAWLER_RUN_ID: ${{ github.event.inputs.crawler_run_id }}
          CRAWLER_RUN_ATTEMPT: ${{ github.event.inputs.crawler_run_attempt }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: |
          set -euo pipefail
          echo "尝试下载最新的爬虫数据 artifact..."
          rm -rf merge-inputs
          mkdir -p merge-inputs/stable/autohome merge-inputs/stable/dongchedi merge-inputs/stable/yiche
          mkdir -p merge-inputs/incremental/autohome merge-inputs/incremental/dongchedi merge-inputs/incremental/yiche

          CN_DAY=$(TZ=Asia/Shanghai date +%d)
          CN_MONTH=$(TZ=Asia/Shanghai date +%Y%m)
          if [ $((10#$CN_DAY)) -le 15 ]; then
            MIN_ARTIFACT_DATE="${CN_MONTH}01"
          else
            MIN_ARTIFACT_DATE="${CN_MONTH}16"
          fi
          AUTOHOME_STABLE_MIN_DATE_ARGS=(--min-date "$MIN_ARTIFACT_DATE")
          DONGCHEDI_STABLE_MIN_DATE_ARGS=(--min-date "$MIN_ARTIFACT_DATE")
          PARTIAL_SOURCE=''
          PARTIAL_ARTIFACT_ID=''
          PARTIAL_ARTIFACT_NAME=''
          PARTIAL_ARTIFACT_SHA256=''
          if [ "$DEBUG_MODE" = "true" ]; then
            AUTOHOME_STABLE_MIN_DATE_ARGS=()
            DONGCHEDI_STABLE_MIN_DATE_ARGS=()
            echo "debug 模式允许 stable-first 基线回退到最近可用的历史 stable artifact"
          else
            echo "只接受当前半月内 artifact，最早日期: $MIN_ARTIFACT_DATE"
            case "$TRIGGER_SOURCE" in
              autohome-crawl)
                PARTIAL_SOURCE=autohome
                PARTIAL_WORKFLOW='.github/workflows/crawl-autohome.yml'
                PARTIAL_REGEX='^autohome-partial-data-[0-9]{8}$'
                PARTIAL_JSON_PATTERN='autoHome_*.json'
                PARTIAL_STABLE_OUTPUT='autoHome_partial_prepared.json'
                PARTIAL_TARGET='autoHome_stable.json'
                ;;
              dongchedi-crawl)
                PARTIAL_SOURCE=dongchedi
                PARTIAL_WORKFLOW='.github/workflows/crawl-dongchedi.yml'
                PARTIAL_REGEX='^dongchedi-partial-data-[0-9]{8}$'
                PARTIAL_JSON_PATTERN='dongchedi_*.json'
                PARTIAL_STABLE_OUTPUT='dongchedi_partial_prepared.json'
                PARTIAL_TARGET='dongchedi_stable.json'
                ;;
              yiche-crawl)
                PARTIAL_SOURCE=yiche
                PARTIAL_WORKFLOW='.github/workflows/crawl-yiche.yml'
                PARTIAL_REGEX="^yiche-partial-data-([0-9]{8})-${CRAWLER_RUN_ID}-${CRAWLER_RUN_ATTEMPT}$"
                PARTIAL_JSON_PATTERN='yiche_*.json'
                PARTIAL_STABLE_OUTPUT='yiche_partial_prepared.json'
                PARTIAL_TARGET='yiche_stable.json'
                ;;
            esac
            if [ -n "$PARTIAL_SOURCE" ]; then
              if ! [[ "$CRAWLER_RUN_ID" =~ ^[0-9]+$ && "$CRAWLER_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
                echo "partial 合并必须提供纯数字 crawler_run_id/crawler_run_attempt"
                exit 1
              fi
              IFS=$'\t' read -r RUN_ATTEMPT RUN_PATH RUN_STATUS RUN_CONCLUSION RUN_STARTED_AT RUN_UPDATED_AT < <(
                gh api "repos/${{ github.repository }}/actions/runs/$CRAWLER_RUN_ID/attempts/$CRAWLER_RUN_ATTEMPT" \
                  --jq '[.run_attempt, .path, .status, .conclusion, .run_started_at, .updated_at] | @tsv'
              )
              RUN_PATH="${RUN_PATH%%@*}"
              if [ "$RUN_ATTEMPT" != "$CRAWLER_RUN_ATTEMPT" ] \
                || [ "$RUN_PATH" != "$PARTIAL_WORKFLOW" ] \
                || [ "$RUN_STATUS" != "completed" ] \
                || [ "$RUN_CONCLUSION" != "success" ]; then
                echo "指定 run/attempt/source 不是已成功完成的 partial workflow"
                exit 1
              fi
              mapfile -t PARTIAL_ARTIFACTS < <(
                gh api "repos/${{ github.repository }}/actions/runs/$CRAWLER_RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.expired == false) | [.id, .name, .created_at, .digest] | @tsv' |
                  while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME ARTIFACT_CREATED_AT ARTIFACT_DIGEST; do
                    if [[ "$ARTIFACT_NAME" =~ $PARTIAL_REGEX ]]; then
                      if [ "$PARTIAL_SOURCE" = "yiche" ]; then
                        ARTIFACT_DATE="${BASH_REMATCH[1]}"
                      else
                        ARTIFACT_DATE="${ARTIFACT_NAME##*-}"
                      fi
                      if [[ "$ARTIFACT_DATE" < "$MIN_ARTIFACT_DATE" ]]; then
                        continue
                      fi
                      if [[ "$ARTIFACT_CREATED_AT" < "$RUN_STARTED_AT" ]]; then
                        continue
                      fi
                      if [[ "$ARTIFACT_CREATED_AT" > "$RUN_UPDATED_AT" ]]; then
                        continue
                      fi
                      if ! [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
                        echo "partial artifact digest 非法" >&2
                        exit 1
                      fi
                      printf '%s\t%s\t%s\t%s\n' "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_CREATED_AT" "${ARTIFACT_DIGEST#sha256:}"
                    fi
                  done
              )
              if [ "${#PARTIAL_ARTIFACTS[@]}" -gt 1 ]; then
                echo "指定 $PARTIAL_SOURCE run 的当前 attempt partial artifact 不唯一"
                exit 1
              elif [ "${#PARTIAL_ARTIFACTS[@]}" -eq 1 ]; then
                IFS=$'\t' read -r PARTIAL_ARTIFACT_ID PARTIAL_ARTIFACT_NAME _ PARTIAL_ARTIFACT_SHA256 <<< "${PARTIAL_ARTIFACTS[0]}"
                if [ "$PARTIAL_SOURCE" = "autohome" ]; then
                  AUTOHOME_STABLE_MIN_DATE_ARGS=()
                elif [ "$PARTIAL_SOURCE" = "dongchedi" ]; then
                  DONGCHEDI_STABLE_MIN_DATE_ARGS=()
                fi
                echo "$PARTIAL_SOURCE 使用当前 attempt partial artifact $PARTIAL_ARTIFACT_NAME，允许对应 stable 基线回退"
              fi
            fi
          fi

          python scripts/download_latest_crawler_artifact.py \
            --repo "${{ github.repository }}" \
            --workflow crawl-autohome.yml \
            --artifact-prefix autohome-data- \
            --json-pattern "autoHome_*.json" \
            --label "汽车之家" \
            --output-dir merge-inputs/stable/autohome \
            "${AUTOHOME_STABLE_MIN_DATE_ARGS[@]}" \
            --min-rows 50

          python scripts/download_latest_crawler_artifact.py \
            --repo "${{ github.repository }}" \
            --workflow crawl-dongchedi.yml \
            --artifact-prefix dongchedi-data- \
            --json-pattern "dongchedi_*.json" \
            --label "懂车帝" \
            --output-dir merge-inputs/stable/dongchedi \
            "${DONGCHEDI_STABLE_MIN_DATE_ARGS[@]}" \
            --min-rows 50

          mapfile -t AUTOHOME_STABLE < <(find merge-inputs/stable/autohome -maxdepth 1 -type f -name 'autoHome_*.json' -print)
          mapfile -t DONGCHEDI_STABLE < <(find merge-inputs/stable/dongchedi -maxdepth 1 -type f -name 'dongchedi_*.json' -print)
          if [ "$DEBUG_MODE" != "true" ]; then
            if [ "$PARTIAL_SOURCE" != "autohome" ] && [ "${#AUTOHOME_STABLE[@]}" -ne 1 ]; then
              python scripts/download_latest_crawler_artifact.py \
                --repo "${{ github.repository }}" \
                --workflow crawl-autohome.yml \
                --artifact-prefix autohome-partial-data- \
                --json-pattern "autoHome_*.json" \
                --label "汽车之家 current partial" \
                --output-dir merge-inputs/incremental/autohome \
                --min-date "$MIN_ARTIFACT_DATE" \
                --min-rows 50
              mapfile -t AUTOHOME_PARTIAL < <(find merge-inputs/incremental/autohome -type f -name 'autoHome_*.json' -print)
              if [ "${#AUTOHOME_PARTIAL[@]}" -gt 1 ]; then
                echo "汽车之家 current partial 不唯一，拒绝接入"
                exit 1
              elif [ "${#AUTOHOME_PARTIAL[@]}" -eq 1 ]; then
                echo "汽车之家发现同半月成功 partial，尝试补充历史 stable 基线"
                python scripts/download_latest_crawler_artifact.py \
                  --repo "${{ github.repository }}" \
                  --workflow crawl-autohome.yml \
                  --artifact-prefix autohome-data- \
                  --json-pattern "autoHome_*.json" \
                  --label "汽车之家历史基线" \
                  --output-dir merge-inputs/stable/autohome \
                  --min-rows 50
              fi
            fi
            if [ "$PARTIAL_SOURCE" != "dongchedi" ] && [ "${#DONGCHEDI_STABLE[@]}" -ne 1 ]; then
              python scripts/download_latest_crawler_artifact.py \
                --repo "${{ github.repository }}" \
                --workflow crawl-dongchedi.yml \
                --artifact-prefix dongchedi-partial-data- \
                --json-pattern "dongchedi_*.json" \
                --label "懂车帝 current partial" \
                --output-dir merge-inputs/incremental/dongchedi \
                --min-date "$MIN_ARTIFACT_DATE" \
                --min-rows 50
              mapfile -t DONGCHEDI_PARTIAL < <(find merge-inputs/incremental/dongchedi -type f -name 'dongchedi_*.json' -print)
              if [ "${#DONGCHEDI_PARTIAL[@]}" -gt 1 ]; then
                echo "懂车帝 current partial 不唯一，拒绝接入"
                exit 1
              elif [ "${#DONGCHEDI_PARTIAL[@]}" -eq 1 ]; then
                echo "懂车帝发现同半月成功 partial，尝试补充历史 stable 基线"
                python scripts/download_latest_crawler_artifact.py \
                  --repo "${{ github.repository }}" \
                  --workflow crawl-dongchedi.yml \
                  --artifact-prefix dongchedi-data- \
                  --json-pattern "dongchedi_*.json" \
                  --label "懂车帝历史基线" \
                  --output-dir merge-inputs/stable/dongchedi \
                  --min-rows 50
              fi
            fi
          fi

          python scripts/download_latest_crawler_artifact.py \
            --repo "${{ github.repository }}" \
            --workflow crawl-yiche.yml \
            --artifact-prefix yiche-data- \
            --json-pattern "yiche_*.json" \
            --label "易车" \
            --output-dir merge-inputs/stable/yiche \
            --min-bytes 1 \
            --min-rows 1 || true

          mapfile -t AUTOHOME_STABLE < <(find merge-inputs/stable/autohome -maxdepth 1 -type f -name 'autoHome_*.json' -print)
          mapfile -t DONGCHEDI_STABLE < <(find merge-inputs/stable/dongchedi -maxdepth 1 -type f -name 'dongchedi_*.json' -print)
          mapfile -t YICHE_STABLE < <(find merge-inputs/stable/yiche -maxdepth 1 -type f -name 'yiche_*.json' -print)
          if [ "${#AUTOHOME_STABLE[@]}" -ne 1 ] || [ "${#DONGCHEDI_STABLE[@]}" -ne 1 ]; then
            echo "当前半月 stable artifact 不齐备，改用 Pages 已发布精确单源行作为缺失 stable 基线"
            curl --fail --show-error --silent --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 \
              https://cars.jiucai.eu.org/data/latest.json \
              --output merge-inputs/current-pages-latest.json
            if [ "${#AUTOHOME_STABLE[@]}" -ne 1 ]; then
              python scripts/filter_pages_source_baseline.py --input merge-inputs/current-pages-latest.json --output merge-inputs/stable/autohome/autoHome_pages_baseline.json --source autohome --min-rows 50
              mapfile -t AUTOHOME_STABLE < <(find merge-inputs/stable/autohome -maxdepth 1 -type f -name 'autoHome_*.json' -print)
            fi
            if [ "${#DONGCHEDI_STABLE[@]}" -ne 1 ]; then
              python scripts/filter_pages_source_baseline.py --input merge-inputs/current-pages-latest.json --output merge-inputs/stable/dongchedi/dongchedi_pages_baseline.json --source dongchedi --min-rows 50
              mapfile -t DONGCHEDI_STABLE < <(find merge-inputs/stable/dongchedi -maxdepth 1 -type f -name 'dongchedi_*.json' -print)
            fi
          fi
          if [ "${#AUTOHOME_STABLE[@]}" -ne 1 ] || [ "${#DONGCHEDI_STABLE[@]}" -ne 1 ]; then
            echo "爬虫 stable artifact 尚未齐备，交由完整性校验安全跳过"
            exit 0
          fi

          if [ "$DEBUG_MODE" = "true" ]; then
            if ! [[ "$CRAWLER_RUN_ID" =~ ^[0-9]+$ && "$CRAWLER_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
              echo "debug 模式必须提供纯数字 crawler_run_id/crawler_run_attempt"
              exit 1
            fi
            case "$TRIGGER_SOURCE" in
              autohome-crawl)
                SOURCE_DIR=autohome
                ARTIFACT_PREFIX=autohome-debug-data
                JSON_PATTERN='autoHome_*.json'
                EXPECTED_WORKFLOW='.github/workflows/crawl-autohome.yml'
                ;;
              dongchedi-crawl)
                SOURCE_DIR=dongchedi
                ARTIFACT_PREFIX=dongchedi-debug-data
                JSON_PATTERN='dongchedi_*.json'
                EXPECTED_WORKFLOW='.github/workflows/crawl-dongchedi.yml'
              ;;
            yiche-crawl)
              SOURCE_DIR=yiche
              JSON_PATTERN='yiche_*.json'
              EXPECTED_WORKFLOW='.github/workflows/crawl-yiche.yml'
              ;;
              *)
                echo "debug trigger_source 必须是 autohome-crawl、dongchedi-crawl 或 yiche-crawl"
                exit 1
                ;;
            esac

            RUN_ATTEMPT=$(gh api "repos/${{ github.repository }}/actions/runs/$CRAWLER_RUN_ID" --jq '.run_attempt')
            RUN_PATH=$(gh api "repos/${{ github.repository }}/actions/runs/$CRAWLER_RUN_ID" --jq '.path')
            RUN_PATH="${RUN_PATH%%@*}"
            if [ "$RUN_ATTEMPT" != "$CRAWLER_RUN_ATTEMPT" ] || [ "$RUN_PATH" != "$EXPECTED_WORKFLOW" ]; then
              echo "指定 run/attempt/source 与爬虫 workflow 不匹配"
              exit 1
            fi

            if [ "$SOURCE_DIR" = "yiche" ]; then
              ARTIFACT_REGEX="^yiche-(data|partial-data-[0-9]{8})-${CRAWLER_RUN_ID}-${CRAWLER_RUN_ATTEMPT}$"
            else
              ARTIFACT_REGEX="^${ARTIFACT_PREFIX}-[0-9]{8}-${CRAWLER_RUN_ID}-${CRAWLER_RUN_ATTEMPT}$"
            fi
            mapfile -t DEBUG_ARTIFACTS < <(
              gh api "repos/${{ github.repository }}/actions/runs/$CRAWLER_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' \
                | grep -E "$ARTIFACT_REGEX" || true
            )
            if [ "${#DEBUG_ARTIFACTS[@]}" -ne 1 ]; then
              echo "指定 run/attempt/source 的 debug artifact 必须精确存在一份"
              exit 1
            fi

            mkdir -p "merge-inputs/debug/$SOURCE_DIR"
            gh run download "$CRAWLER_RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "${DEBUG_ARTIFACTS[0]}" \
              --dir "merge-inputs/debug/$SOURCE_DIR"
            mapfile -t DEBUG_JSON < <(find "merge-inputs/debug/$SOURCE_DIR" -type f -name "$JSON_PATTERN" -print)
            if [ "${#DEBUG_JSON[@]}" -ne 1 ]; then
              echo "debug artifact 内必须精确包含一份 $JSON_PATTERN"
              exit 1
            fi

            if [ "$SOURCE_DIR" = "autohome" ]; then
              python scripts/prepare_debug_merge_inputs.py \
                --stable "${AUTOHOME_STABLE[0]}" --debug "${DEBUG_JSON[0]}" --source autohome --output autoHome_debug_prepared.json
              cp "${DONGCHEDI_STABLE[0]}" dongchedi_stable.json
            elif [ "$SOURCE_DIR" = "dongchedi" ]; then
              cp "${AUTOHOME_STABLE[0]}" autoHome_stable.json
              python scripts/prepare_debug_merge_inputs.py \
                --stable "${DONGCHEDI_STABLE[0]}" --debug "${DEBUG_JSON[0]}" --source dongchedi --output dongchedi_debug_prepared.json
            else
              cp "${AUTOHOME_STABLE[0]}" autoHome_stable.json
              cp "${DONGCHEDI_STABLE[0]}" dongchedi_stable.json
              cp "${DEBUG_JSON[0]}" yiche_stable.json
            fi
          else
            cp "${AUTOHOME_STABLE[0]}" autoHome_stable.json
            cp "${DONGCHEDI_STABLE[0]}" dongchedi_stable.json
            if [ "${#YICHE_STABLE[@]}" -ge 1 ]; then
              cp "${YICHE_STABLE[0]}" yiche_stable.json
            fi
            if [ -n "$PARTIAL_ARTIFACT_NAME" ]; then
              echo "下载已确认的 partial artifact $PARTIAL_ARTIFACT_ID/$PARTIAL_ARTIFACT_NAME"
              PARTIAL_ARCHIVE="merge-inputs/incremental/$PARTIAL_SOURCE/artifact.zip"
              gh api "repos/${{ github.repository }}/actions/artifacts/$PARTIAL_ARTIFACT_ID/zip" > "$PARTIAL_ARCHIVE"
              echo "$PARTIAL_ARTIFACT_SHA256  $PARTIAL_ARCHIVE" | sha256sum --check --strict
              unzip -q "$PARTIAL_ARCHIVE" -d "merge-inputs/incremental/$PARTIAL_SOURCE"
              rm -f "$PARTIAL_ARCHIVE"
              mapfile -t PARTIAL_JSON < <(find "merge-inputs/incremental/$PARTIAL_SOURCE" -type f -name "$PARTIAL_JSON_PATTERN" -print)
              if [ "${#PARTIAL_JSON[@]}" -ne 1 ]; then
                echo "partial artifact 内必须精确包含一份 $PARTIAL_JSON_PATTERN"
                exit 1
              fi
            fi

            mapfile -t AUTOHOME_PARTIAL < <(find merge-inputs/incremental/autohome -type f -name 'autoHome_*.json' -print)
            mapfile -t DONGCHEDI_PARTIAL < <(find merge-inputs/incremental/dongchedi -type f -name 'dongchedi_*.json' -print)
            mapfile -t YICHE_PARTIAL < <(find merge-inputs/incremental/yiche -type f -name 'yiche_*.json' -print)
            if [ "${#AUTOHOME_PARTIAL[@]}" -gt 1 ] || [ "${#DONGCHEDI_PARTIAL[@]}" -gt 1 ] || [ "${#YICHE_PARTIAL[@]}" -gt 1 ]; then
              echo "每个来源最多只能接入一份 current partial"
              exit 1
            fi
            if [ "${#AUTOHOME_PARTIAL[@]}" -eq 1 ]; then
              python scripts/prepare_debug_merge_inputs.py \
                --stable "${AUTOHOME_STABLE[0]}" --debug "${AUTOHOME_PARTIAL[0]}" \
                --source autohome --partial --output autoHome_partial_prepared.json
              mv autoHome_partial_prepared.json autoHome_stable.json
            else
              echo "AUTOHOME_PARTIAL_NOT_JOINED: 使用 stable/Pages 基线"
            fi
            if [ "${#DONGCHEDI_PARTIAL[@]}" -eq 1 ]; then
              python scripts/prepare_debug_merge_inputs.py \
                --stable "${DONGCHEDI_STABLE[0]}" --debug "${DONGCHEDI_PARTIAL[0]}" \
                --source dongchedi --partial --output dongchedi_partial_prepared.json
              mv dongchedi_partial_prepared.json dongchedi_stable.json
            else
              echo "DONGCHEDI_PARTIAL_NOT_JOINED: 使用 stable/Pages 基线"
            fi
            if [ "${#YICHE_PARTIAL[@]}" -eq 1 ]; then
              if [ "${#YICHE_STABLE[@]}" -eq 1 ]; then
                python scripts/prepare_debug_merge_inputs.py \
                  --stable "${YICHE_STABLE[0]}" --debug "${YICHE_PARTIAL[0]}" \
                  --source yiche --partial --output yiche_partial_prepared.json
                mv yiche_partial_prepared.json yiche_stable.json
              else
                echo "易车无历史 stable，使用已认证 partial；Pages 基线门禁仍负责防回退"
                cp "${YICHE_PARTIAL[0]}" yiche_stable.json
              fi
            else
              echo "YICHE_PARTIAL_NOT_JOINED: 使用 stable/Pages 基线"
            fi
          fi

          echo "规范化后的合并输入:"
          ls -la autoHome_*.json dongchedi_*.json yiche_*.json 2>/dev/null || true
          mapfile -t FINAL_AUTOHOME_INPUT < <(find . -maxdepth 1 -type f -name 'autoHome_*.json' -print)
          mapfile -t FINAL_DONGCHEDI_INPUT < <(find . -maxdepth 1 -type f -name 'dongchedi_*.json' -print)
          if [ "${#FINAL_AUTOHOME_INPUT[@]}" -ne 1 ] || [ "${#FINAL_DONGCHEDI_INPUT[@]}" -ne 1 ]; then
            echo "合并前必须精确存在一份汽车之家输入和一份懂车帝输入"
            exit 1
          fi
          test -s "${FINAL_AUTOHOME_INPUT[0]}"
          test -s "${FINAL_DONGCHEDI_INPUT[0]}"

      - name: 校验爬虫数据完整性
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_MERGE: ${{ github.event.inputs.force_merge }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import sys

          checks = [
              ("汽车之家", "autoHome_*.json"),
              ("懂车帝", "dongchedi_*.json"),
          ]
          ok = True
          for label, pattern in checks:
              files = sorted(glob.glob(pattern))
              if not files:
                  print(f"{label} 未找到 {pattern} 数据文件")
                  ok = False
                  continue
              path = files[-1]
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      rows = json.load(f)
              except Exception as exc:
                  print(f"{label} 数据文件 {path} 读取失败: {exc}")
                  ok = False
                  continue
              count = len(rows) if isinstance(rows, list) else 0
              print(f"{label} 数据文件: {path}, 行数: {count}")
              if count < 50:
                  print(f"{label} 数据少于 50 行，疑似爬虫数据不完整，拒绝合并")
                  ok = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ok else 'false'}\n")
          if not ok:
              print("爬虫数据尚未完整，本次合并成功跳过，不发布不完整数据")
              if os.environ.get("EVENT_NAME") == "workflow_dispatch" and os.environ.get("FORCE_MERGE") == "true":
                  print("手动强制合并要求数据必须完整，按失败处理")
                  sys.exit(1)
              sys.exit(0)
          PY

      - name: 爬取零整比数据
        if: steps.validate.outputs.ready == 'true'
        run: python scripts/crawl_zero_to_whole_ratio.py
        env:
          ZERO_TO_WHOLE_RATIO_URLS: ${{ vars.ZERO_TO_WHOLE_RATIO_URLS }}

      - name: 设置日期变量
        id: date
        if: steps.validate.outputs.ready == 'true'
        run: |
          CRAWL_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          CRAWL_TIME=$(TZ=Asia/Shanghai date +%H%M)
          echo "date=$CRAWL_DATE" >> "$GITHUB_OUTPUT"
          echo "time=$CRAWL_TIME" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${CRAWL_DATE}-${CRAWL_TIME}-${{ github.run_id }}-a${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: 合并数据文件
        if: steps.validate.outputs.ready == 'true'
        env:
          MERGE_DATE: ${{ steps.date.outputs.date }}
        run: |
          if ls autoHome_*.json dongchedi_*.json 2>/dev/null; then
            echo "找到数据文件，开始合并..."
            python scripts/merge_data.py
          else
            echo "没有找到数据文件，跳过合并"
            exit 0
          fi

      - name: 保留当前 Pages 发布基线
        if: steps.validate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 \
            https://cars.jiucai.eu.org/data/latest.json \
            --output /tmp/current-pages-latest.json
          python scripts/preserve_publish_baseline.py \
            --baseline /tmp/current-pages-latest.json \
            --merged-json "merged_${{ steps.date.outputs.date }}.json" \
            --merged-csv "merged_${{ steps.date.outputs.date }}.csv" \
            --filtered-json "filtered_cars_${{ steps.date.outputs.date }}.json" \
            --filtered-csv "filtered_cars_${{ steps.date.outputs.date }}.csv"

      - name: 检查合并结果
        if: steps.validate.outputs.ready == 'true'
        run: |
          if [ -s "merged_${{ steps.date.outputs.date }}.csv" ] && [ -s "merged_${{ steps.date.outputs.date }}.json" ] && [ -f "filtered_cars_${{ steps.date.outputs.date }}.json" ]; then
            echo "合并成功，生成文件:"
            ls -la merged_* filtered_cars_*
            ROWS=$(python -c 'import json; print(len(json.load(open("merged_${{ steps.date.outputs.date }}.json", encoding="utf-8"))))')
            echo "合并数据行数: $ROWS"
            if [ "$ROWS" -lt 50 ]; then
              echo "合并数据少于 50 行，疑似爬虫数据不完整，拒绝发布"
              exit 1
            fi
          else
            echo "合并失败，未生成输出文件"
            exit 1
          fi

      - name: 发布防缩小校验
        if: steps.validate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python scripts/verify_publish_superset.py \
            --baseline /tmp/current-pages-latest.json \
            --candidate "merged_${{ steps.date.outputs.date }}.json"

      - name: 生成合并证据报告
        if: steps.validate.outputs.ready == 'true'
        run: python scripts/analysis/merge_evidence_report.py --input "merged_${{ steps.date.outputs.date }}.json" --output docs/analysis/merge_evidence_report.json

      - name: 上传合并分析报告
        if: steps.validate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: merge-analysis-${{ steps.date.outputs.date }}
          path: |
            docs/analysis/merge_evidence_report.json
            docs/analysis/merge_stats_${{ steps.date.outputs.date }}.json
          retention-days: 3

      - name: 上传合并产物
        if: steps.validate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: car-data-${{ steps.date.outputs.date }}-${{ steps.date.outputs.time }}
          path: |
            merged_${{ steps.date.outputs.date }}.csv
            merged_${{ steps.date.outputs.date }}.json
            filtered_cars_${{ steps.date.outputs.date }}.csv
            filtered_cars_${{ steps.date.outputs.date }}.json
            zero_to_whole_ratios_${{ steps.date.outputs.date }}.json
          retention-days: 3

  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [merge-data]
    outputs:
      release_tag: ${{ needs.merge-data.outputs.release_tag }}
    if: needs.merge-data.outputs.ready == 'true'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 下载合并产物
        uses: actions/download-artifact@v4
        with:
          name: car-data-${{ needs.merge-data.outputs.crawl_date }}-${{ needs.merge-data.outputs.crawl_time }}
          path: release-files

      - name: 创建发布
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.merge-data.outputs.release_tag }}
          name: 车型数据 ${{ needs.merge-data.outputs.crawl_date }}-${{ needs.merge-data.outputs.crawl_time }}
          files: |
            release-files/merged_${{ needs.merge-data.outputs.crawl_date }}.csv
            release-files/merged_${{ needs.merge-data.outputs.crawl_date }}.json
            release-files/filtered_cars_${{ needs.merge-data.outputs.crawl_date }}.csv
            release-files/filtered_cars_${{ needs.merge-data.outputs.crawl_date }}.json
            release-files/zero_to_whole_ratios_${{ needs.merge-data.outputs.crawl_date }}.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [create-release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'audit_only') &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.mode != 'merge_and_deploy' ||
        needs.create-release.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 设置 Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: 准备静态站点
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || needs.create-release.outputs.release_tag) || '' }}
        run: |
          set -euo pipefail
          rm -rf site release-files
          mkdir -p site/data site/config
          cp -R docs/. site/
          cp config/filter_conditions.json site/config/filter_conditions.json

          FOUND_DATA=false
          if [ -n "$RELEASE_TAG" ]; then
            TAGS=("$RELEASE_TAG")
          else
            mapfile -t TAGS < <(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName --jq '.[].tagName')
          fi

          for TAG in "${TAGS[@]}"; do
            rm -rf release-files
            mkdir -p release-files
            if ! gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir release-files \
              --pattern 'merged_*.json' \
              --pattern 'filtered_cars_*.json' \
              --pattern 'merged_*.csv' \
              --pattern 'filtered_cars_*.csv'; then
              if [ -n "$RELEASE_TAG" ]; then
                echo "指定 Release $TAG 下载失败"
                exit 1
              fi
              continue
            fi

            mapfile -t MERGED_JSON_FILES < <(find release-files -maxdepth 1 -type f -name 'merged_*.json' -print)
            mapfile -t FILTERED_JSON_FILES < <(find release-files -maxdepth 1 -type f -name 'filtered_cars_*.json' -print)
            mapfile -t MERGED_CSV_FILES < <(find release-files -maxdepth 1 -type f -name 'merged_*.csv' -print)
            mapfile -t FILTERED_CSV_FILES < <(find release-files -maxdepth 1 -type f -name 'filtered_cars_*.csv' -print)
            if [ "${#MERGED_JSON_FILES[@]}" -ne 1 ] || [ "${#FILTERED_JSON_FILES[@]}" -ne 1 ] || \
               [ "${#MERGED_CSV_FILES[@]}" -ne 1 ] || [ "${#FILTERED_CSV_FILES[@]}" -ne 1 ]; then
              if [ -n "$RELEASE_TAG" ]; then
                echo "指定 Release $TAG 的数据资产不完整或不唯一"
                exit 1
              fi
              continue
            fi
            MERGED_JSON="${MERGED_JSON_FILES[0]}"

            ROWS=$(python - "$MERGED_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(len(json.load(f)))
          PY
          )

            if [ "$ROWS" -lt 50 ]; then
              echo "警告：$TAG 的 merged 数据只有 $ROWS 行"
            fi

            curl --fail --show-error --silent --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 \
              https://cars.jiucai.eu.org/data/latest.json \
              --output /tmp/current-pages-latest.json
            python scripts/verify_publish_superset.py \
              --baseline /tmp/current-pages-latest.json \
              --candidate "$MERGED_JSON"

            DATE=$(basename "$MERGED_JSON" | sed -E 's/merged_([0-9]+)\.json/\1/')
            cp "$MERGED_JSON" site/data/latest.json
            cp "${FILTERED_JSON_FILES[0]}" site/data/filtered.json
            python scripts/prepare_pages_payload.py \
              --input site/data/latest.json \
              --output site/data/latest.json \
              --min-year 2022
            python scripts/prepare_pages_payload.py \
              --input site/data/filtered.json \
              --output site/data/filtered.json \
              --min-year 2022
            python scripts/audit_pages_payload.py \
              --baseline /tmp/current-pages-latest.json \
              --candidate site/data/latest.json \
              --report pages-audit-report.json \
              --head-sha "$GITHUB_SHA"
            cp "${MERGED_CSV_FILES[0]}" "site/data/merged_${DATE}.csv"
            cp "${FILTERED_CSV_FILES[0]}" "site/data/filtered_cars_${DATE}.csv"

            python - "$DATE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          date = sys.argv[1]
          with open("site/data/latest.json", encoding="utf-8") as f:
              latest = json.load(f)
          with open("site/data/filtered.json", encoding="utf-8") as f:
              filtered = json.load(f)

          manifest = {
              "date": date,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "rowCount": len(latest),
              "filteredRowCount": len(filtered),
              "files": {
                  "latestJson": "data/latest.json",
                  "filteredJson": "data/filtered.json",
                  "latestCsv": f"data/merged_{date}.csv",
                  "filteredCsv": f"data/filtered_cars_{date}.csv",
              },
          }
          with open("site/data/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

            FOUND_DATA=true
            echo "使用 $TAG 发布网页数据：$ROWS 行"
            break
          done

          if [ "$FOUND_DATA" != "true" ]; then
            echo "未找到可用 Release 数据，仅发布网页外壳"
          fi

          touch site/.nojekyll

      - name: 上传 Pages 发布审计证据
        if: ${{ always() && hashFiles('pages-audit-report.json') != '' }}
        uses: actions/upload-artifact@main
        with:
          name: pages-audit-report
          path: |
            pages-audit-report.json
            /tmp/current-pages-latest.json
          if-no-files-found: error
          retention-days: 3

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  audit:
    name: Single-source audit
    needs: deploy
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy_only') &&
      (
        needs.deploy.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_only')
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch latest.json from Pages
        run: |
          REPO=$(echo ${{ github.repository }} | sed 's|.*/||')
          case "$REPO" in
            crawl_cars) PAGES_URL="https://cars.jiucai.eu.org/data/latest.json" ;;
            crawl_phones) PAGES_URL="https://phones.jiucai.eu.org/data/latest.json" ;;
            crawl_laptops) PAGES_URL="https://nbs.jiucai.eu.org/data/latest.json" ;;
            *) echo "Unknown repo"; exit 0 ;;
          esac
          echo "PAGES_URL=$PAGES_URL"
          mkdir -p ./data
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 "$PAGES_URL" -o ./data/latest.json || echo "FETCH_FAILED"

      - name: Analyze single-source data
        run: |
          python3 scripts/analyze_single_source.py --data ./data/latest.json --output ./audit_report.json
          cat ./audit_report.json | head -50

      - name: Prepare deterministic audit prompt for Agent
        id: audit_prompt
        run: |
          python3 scripts/llm_single_source_audit.py \
            --data ./data/latest.json \
            --report ./audit_report.json \
            --output ./llm_analysis.md \
            --prompt-output ./llm_agent_prompt.md

      - name: Run configured free endpoints first
        id: free_route
        if: steps.audit_prompt.outcome == 'success'
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          MODAL_API_KEY: ${{ secrets.MODAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          ATOMGIT_API_KEY: ${{ secrets.ATOMGIT_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/free_first_router.py \
            --prompt-file ./llm_agent_prompt.md \
            --output ./free_agent_analysis.md \
            --metadata-output ./ai_route.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js for OpenCode Agent
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fixed OpenCode CLI
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        run: npm install --global opencode-ai@1.18.11

      - name: Prepare isolated OpenCode directory
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-agent"
          cp "$GITHUB_WORKSPACE/llm_agent_prompt.md" "$RUNNER_TEMP/opencode-agent/prompt.md"

      - name: Run Kimi Coding Plan through read-only OpenCode Agent
        id: kimi_agent
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        continue-on-error: true
        env:
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"autoupdate":false,"provider":{"kimi-coding-plan":{"npm":"@ai-sdk/openai-compatible","name":"Kimi Coding Plan","options":{"baseURL":"https://api.kimi.com/coding/v1","apiKey":"{env:KIMI_CODINGPLAN_API_KEY}"},"models":{"kimi-k2.6":{"limit":{"context":262144,"output":32768}}}}},"agent":{"plan":{"model":"kimi-coding-plan/kimi-k2.6","permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}},"permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}
        run: opencode run --pure --agent plan --model kimi-coding-plan/kimi-k2.6 --format default --dir "$RUNNER_TEMP/opencode-agent" --file prompt.md "Use the attached deterministic audit prompt. Return only the requested analysis, and do not call tools or modify files." > ./llm_agent_analysis.md

      - name: Finalize audit analysis without passing Plan key to Python
        if: always()
        run: |
          if [[ "${{ steps.free_route.outputs.free_status }}" == "success" && -s ./free_agent_analysis.md ]]; then
            if ! python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --agent-response-input ./free_agent_analysis.md; then
              python3 scripts/llm_single_source_audit.py \
                --data ./data/latest.json \
                --report ./audit_report.json \
                --output ./llm_analysis.md \
                --fallback-only
            fi
          elif [[ "${{ steps.free_route.outputs.paid_required }}" == "true" &&
                  "${{ steps.kimi_agent.outcome }}" == "success" &&
                  -s ./llm_agent_analysis.md ]]; then
            if ! python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --agent-response-input ./llm_agent_analysis.md; then
              python3 scripts/llm_single_source_audit.py \
                --data ./data/latest.json \
                --report ./audit_report.json \
                --output ./llm_analysis.md \
                --fallback-only
            fi
          else
            python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --fallback-only
          fi
          echo "=== LLM Analysis ==="
          head -80 ./llm_analysis.md || true

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./audit_report.json', 'utf8');
            const analysis = fs.existsSync('./llm_analysis.md') ? fs.readFileSync('./llm_analysis.md', 'utf8') : 'No LLM analysis available';
            const reportData = JSON.parse(report);
            const title = `Single-source audit: ${reportData.single_rate}% single (${reportData.single_count}/${reportData.total})`;
            const body = `## Single Source Audit Report

            **Generated:** ${new Date().toISOString()}
            **Total rows:** ${reportData.total}
            **Multi-source:** ${reportData.multi_count} (${reportData.multi_rate}%)
            **Single-source:** ${reportData.single_count} (${reportData.single_rate}%)

            ### Root Causes

            ${JSON.stringify(reportData.causes, null, 2)}

            ### Column-name Diagnosis

            ${JSON.stringify(reportData.column_diagnosis || {}, null, 2)}

            ### LLM Analysis (AA 50+ model)

            ${analysis}

            ### Source Distribution

            ${JSON.stringify(reportData.source_distribution, null, 2)}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'single-source-audit'
            });

            const existing = issues.data.find(i => i.title.startsWith('Single-source audit:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['single-source-audit', 'automated']
              });
              console.log('Created new issue');
            }

      - name: Upload single-source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-source-audit-${{ github.run_id }}
          path: |
            audit_report.json
            llm_analysis.md
            llm_agent_prompt.md
          if-no-files-found: warn
          retention-days: 3
