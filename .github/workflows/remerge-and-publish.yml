name: 重合并并发布（不爬取）

# AWS 负责采集，平台仅接收已经发布的原始制品、合并与部署。
# 现网回滚可单独部署已经验证的完整归档。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '验证过的 cnb-data-* 基线；留空取最新完整归档'
        required: false
        default: ''
      aws_raw_release:
        description: 'AWS 原始数据 Release（aws-raw-YYYYMMDDTHHMMSSZ）'
        required: true
        type: string
      date:
        description: '输出日期（默认认输入文件名里的日期）'
        required: false
        default: ''
      max_drop_pct:
        description: '掉行阈值（%）；留空用 15（配额期实测 merged 11.03% / filtered 13.17%）。车款ID 身份守恒不变式无条件生效，与本值无关'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  remerge-and-publish:
    # Pages 部署环境只允许 main。
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main
        with:
          # 代码固定到本轮 github.sha；release 只当数据输入。
          ref: ${{ github.sha }}

      - name: 设置 Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml pyyaml pytest

      - name: 校验不爬源后处理及发布门禁回归
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_publish_observation_lineage.py \
            tests/test_publish_model_year.py \
            tests/test_publish_vehicle_level.py \
            tests/test_source_identity_evidence.py \
            tests/test_sku_dedupe_by_id.py \
            tests/test_pages_payload_audit.py \
            tests/test_pages_asset_readback.py \
            tests/test_merge_data_aliases.py \
            tests/test_scan_pages_columns.py \
            tests/test_remerge_published_data.py \
            tests/test_remerge_final_csv.py \
            tests/test_remerge_failure_propagation.py \
            tests/test_publish_baseline_dirty_values_refolded.py \
            --junitxml=postprocess-regressions.xml


      - name: 红线通道覆盖断言（active 数据链必须都在监视名单里）
        run: python scripts/check_red_channel_coverage.py

      - name: 下载上一轮合并产物
        id: fetch
        env:
          BASELINE_RELEASE: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$BASELINE_RELEASE"
          if [ -z "$TAG" ]; then
            TAG=$(python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" \
              --no-legacy --print-tag)
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          echo "release=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          rm -rf src-data && mkdir -p src-data
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --no-legacy --dir src-data/verified-release
          python scripts/prepare_cnb_pages.py \
            --archive src-data/verified-release/verified-site.zip \
            --manifest src-data/verified-release/manifest.json --site src-data/published-site
          SRC=src-data/merged_published.json
          FILT=src-data/filtered_cars_published.json
          cp src-data/published-site/data/latest.json "$SRC"
          cp src-data/published-site/data/filtered.json "$FILT"
          ls -la src-data
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "filtered=$FILT" >> "$GITHUB_OUTPUT"
          echo "src=$SRC filtered=$FILT"

      - name: 合并前按已保存来源证据校正原始副本（不联网）
        id: correct_source_identities
        env:
          SRC: ${{ steps.fetch.outputs.src }}
          FILT: ${{ steps.fetch.outputs.filtered }}
        run: |
          set -euo pipefail
          # src-data stays byte-for-byte immutable for provenance and both audits.
          mkdir -p corrected-inputs
          CORRECTED_SRC="corrected-inputs/$(basename "$SRC")"
          CORRECTED_FILT="corrected-inputs/$(basename "$FILT")"
          python scripts/reconcile_source_identities.py \
            --input "$SRC" --output "$CORRECTED_SRC" \
            --evidence config/source_identity_evidence.json --report source-identity-latest.json
          python scripts/reconcile_source_identities.py \
            --input "$FILT" --output "$CORRECTED_FILT" \
            --evidence config/source_identity_evidence.json --report source-identity-filtered.json
          echo "src=$CORRECTED_SRC" >> "$GITHUB_OUTPUT"
          echo "filtered=$CORRECTED_FILT" >> "$GITHUB_OUTPUT"

      - name: 接收 AWS 原始数据并合并到已验证基线
        id: ingest_aws
        env:
          RAW_RELEASE: ${{ inputs.aws_raw_release }}
          BASELINE: ${{ steps.correct_source_identities.outputs.src }}
          BASELINE_FILTERED: ${{ steps.correct_source_identities.outputs.filtered }}
        run: |
          set -euo pipefail
          [[ "$RAW_RELEASE" =~ ^aws-raw-[0-9]{8}T[0-9]{6}Z$ ]]
          test "$(gh release view "$RAW_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '(.isDraft == false) and .isPrerelease')" = true
          mkdir aws-raw-input
          gh release download "$RAW_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --dir aws-raw-input --pattern '*.json'
          python scripts/aws_raw_bundle.py publish-github --check-only \
            --tag "$RAW_RELEASE" --repo "$GITHUB_REPOSITORY" aws-raw-input
          for asset in autoHome_aws.json dongchedi_aws.json yiche_aws.json; do
            if [ -f "aws-raw-input/$asset" ]; then
              test ! -e "$asset"
              cp "aws-raw-input/$asset" "$asset"
            fi
          done
          DATE=${RAW_RELEASE:8:8}
          MERGE_DATE="$DATE" python scripts/merge_data.py
          test -s "merged_$DATE.json"
          python scripts/preserve_publish_baseline.py --partial-input --baseline "$BASELINE" \
            --merged-json "merged_$DATE.json" --merged-csv "merged_$DATE.csv" \
            --filtered-json "filtered_cars_$DATE.json" --filtered-csv "filtered_cars_$DATE.csv"
          echo "src=merged_$DATE.json" >> "$GITHUB_OUTPUT"
          echo "filtered=$BASELINE_FILTERED" >> "$GITHUB_OUTPUT"

      - name: 重合并（用修好的归并逻辑，不重新爬取）
        id: remerge
        env:
          SRC: ${{ steps.ingest_aws.outputs.src }}
          FILT: ${{ steps.ingest_aws.outputs.filtered }}
          DATE: ${{ github.event.inputs.date }}
          DROP: ${{ github.event.inputs.max_drop_pct || '15' }}
        run: |
          set -euo pipefail
          ARGS=(--merged "$SRC" --source-identity-evidence config/source_identity_evidence.json)
          # filtered 也只做去重：保住现网发布行集不变，只折叠重复 SKU
          if [ -n "$FILT" ] && [ -f "$FILT" ]; then ARGS+=(--filtered "$FILT"); fi
          if [ -n "$DATE" ]; then ARGS+=(--date "$DATE"); fi
          # 留空 ⇒ 不传，用脚本默认 8.0%。**必须显式留空才走默认**：
          # 本轮 SKU 折叠实测掉 10.80%，不传就跑不出去（但身份不变式无条件通过，
          # 所以抬档是有凭据的跳过，不是关掉闸门）。
          if [ -n "$DROP" ]; then ARGS+=(--max-drop-pct "$DROP"); fi
          python scripts/remerge_published_data.py "${ARGS[@]}" --outdir out | tee remerge-stats.json
          DATE=$(python -c 'import json;print(json.load(open("remerge-stats.json"))["date"])')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"

      - name: 发布防缩小校验（候选必须不丢已发布身份）
        env:
          DATE: ${{ steps.remerge.outputs.date }}
        run: |
          set -euo pipefail
          # 基线 = 上一轮发布数据本身；verify_publish_superset 会先对基线做同一套
          # SKU 归并再比对，因此"被折叠掉的重复行"不会被误判成丢数据。
          cp "${{ steps.fetch.outputs.src }}" "baseline-${DATE}.json"
          cp "${{ steps.fetch.outputs.filtered }}" "baseline-filtered-${DATE}.json"
          python scripts/verify_publish_superset.py \
            --baseline "baseline-${DATE}.json" \
            --candidate "out/merged_${DATE}.json" --strict-identities \
            --source-identity-evidence config/source_identity_evidence.json

      - name: 组装发布站点
        env:
          DATE: ${{ steps.remerge.outputs.date }}
          INPUT_RELEASE: ${{ steps.fetch.outputs.tag }}
          AWS_RAW_RELEASE: ${{ inputs.aws_raw_release }}
          # Lineage uses the verified baseline plus raw observations before remerge.
          RAW_WIDE: ${{ steps.ingest_aws.outputs.src }}
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data site/config
          cp -R docs/. site/
          cp config/filter_conditions.json site/config/filter_conditions.json
          cp "out/merged_${DATE}.json" site/data/latest.json
          cp "out/filtered_cars_${DATE}.json" site/data/filtered.json
          python scripts/prepare_pages_payload.py --input site/data/latest.json --output site/data/latest.json --min-year 2022 --refresh-dealer-prices
          python scripts/prepare_pages_payload.py --input site/data/filtered.json --output site/data/filtered.json --min-year 2022
          python scripts/verify_publish_superset.py \
            --baseline "baseline-filtered-${DATE}.json" \
            --candidate site/data/filtered.json --strict-identities \
            --wide-baseline "$RAW_WIDE" \
            --source-identity-evidence config/source_identity_evidence.json
          python scripts/audit_pages_payload.py \
            --baseline "baseline-${DATE}.json" \
            --candidate site/data/latest.json \
            --report pages-audit-report.json \
            --head-sha "$GITHUB_SHA" --full-validation \
            --source-identity-evidence config/source_identity_evidence.json
          python scripts/audit_pages_payload.py \
            --baseline "baseline-filtered-${DATE}.json" \
            --candidate site/data/filtered.json \
            --report pages-filtered-audit-report.json \
            --head-sha "$GITHUB_SHA" --full-validation \
            --wide-baseline "$RAW_WIDE" \
            --source-identity-evidence config/source_identity_evidence.json
          python - "$DATE" <<'PY'
          import hashlib, json, os, shutil, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from merge_data import collect_fields, write_csv
          from prepare_cnb_pages import asset_digest
          date = sys.argv[1]
          latest = json.load(open("site/data/latest.json", encoding="utf-8"))
          filtered = json.load(open("site/data/filtered.json", encoding="utf-8"))
          write_csv(f"site/data/merged_{date}.csv", latest, collect_fields(latest))
          write_csv(f"site/data/filtered_cars_{date}.csv", filtered, collect_fields(filtered))
          # Release 与 Pages 必须来自同一最终数据，而非 prepare 前的中间 CSV/JSON。
          Path("out").mkdir(exist_ok=True)
          for source, target in [("latest.json", f"merged_{date}.json"),
                                 ("filtered.json", f"filtered_cars_{date}.json"),
                                 (f"merged_{date}.csv", f"merged_{date}.csv"),
                                 (f"filtered_cars_{date}.csv", f"filtered_cars_{date}.csv")]:
              shutil.copy(Path("site/data") / source, Path("out") / target)
          evidence_files = [Path("config/source_identity_evidence.json"),
                            Path("source-identity-latest.json"), Path("source-identity-filtered.json"),
                            Path("pages-audit-report.json"), Path("pages-filtered-audit-report.json"),
                            Path("remerge-stats.json")]
          evidence_hashes = {}
          for path in evidence_files:
              evidence_hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              shutil.copy(path, Path("site/data") / path.name)
          stamp = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
          shutil.copy("site/data/latest.json", f"site/data/latest_{stamp}.json")
          shutil.copy("site/data/filtered.json", f"site/data/filtered_{stamp}.json")
          # 114MB 单文件对前端/复量都太重；按前端既有的分片契约写出带 sha256/rowCount/size
          # 的分片（docs/app.js:179-201 校验，ΣrowCount 必须等于 manifest.rowCount）。
          import hashlib
          CHUNK_ROWS = 2000
          chunks = []
          for _i in range(0, len(latest), CHUNK_ROWS):
              _part = latest[_i:_i + CHUNK_ROWS]
              _rel = "data/latest_%s_part%02d.json" % (stamp, _i // CHUNK_ROWS)
              with open("site/" + _rel, "w", encoding="utf-8") as _fh:
                  json.dump(_part, _fh, ensure_ascii=False, separators=(",", ":"))
              _blob = open("site/" + _rel, "rb").read()
              chunks.append({"path": _rel, "sha256": hashlib.sha256(_blob).hexdigest(),
                             "rowCount": len(_part), "size": len(_blob)})
          # Bind every published JSON/CSV, including aliases and provenance sidecars.
          published_assets = []
          for path in sorted(Path("site").rglob("*")):
              if (path.is_file() and path.suffix.lower() in {".json", ".csv"}
                      and path != Path("site/data/manifest.json")):
                  digest, size = asset_digest(path)
                  published_assets.append({"path": path.relative_to("site").as_posix(),
                                           "sha256": digest, "size": size})
          manifest = {
              "date": date,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "rowCount": len(latest),
              "filteredRowCount": len(filtered),
              "provenance": {
                  "codeCommit": os.environ["GITHUB_SHA"],
                  "workflowRunId": os.environ["GITHUB_RUN_ID"],
                  "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "inputRelease": os.environ["INPUT_RELEASE"],
                  "inputSha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted(Path("src-data").glob("*.json"))
                  },
                  "sourceIdentityEvidenceSha256": evidence_hashes,
              },
              "files": {
                  "additionalDataAssets": published_assets,
                  "latestJson": f"data/latest_{stamp}.json",
                  "latestJsonChunks": chunks,
                  "filteredJson": f"data/filtered_{stamp}.json",
                  "latestCsv": f"data/merged_{date}.csv",
                  "filteredCsv": f"data/filtered_cars_{date}.csv",
              },
          }
          raw_manifest = Path("aws-raw-input/aws-raw-manifest.json")
          manifest["provenance"]["awsRawRelease"] = os.environ["AWS_RAW_RELEASE"]
          manifest["provenance"]["awsRawProducerCommit"] = json.loads(raw_manifest.read_bytes())["producer_commit"]
          manifest["provenance"]["awsRawManifestSha256"] = hashlib.sha256(raw_manifest.read_bytes()).hexdigest()
          json.dump(manifest, open("site/data/manifest.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2)
          print(manifest)
          PY
          if [ -f src-data/column-scan-history.json ]; then
            cp src-data/column-scan-history.json column-scan-history.json
          fi
          node scripts/scan_pages_columns.js --no-browser --require-data \
            --data site/data/latest.json --repo-root . \
            --history column-scan-history.json --out column-scan-report.json
          touch site/.nojekyll

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 校验线上数据清单
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DATE: ${{ steps.remerge.outputs.date }}
        run: |
          set -euo pipefail
          python scripts/prepare_cnb_pages.py --site site --verify-url "$PAGE_URL" --verify-data
          echo "--- 重合并读数 ---"
          cat remerge-stats.json

      # 这一条是「最终验证 pages 数据符合预期」被流水线**使执行**的那一半。
      # 为什么要单独写：`tests/pages_ui.test.js` 里那条线上验收的跳过条件是 `skip: !CARS_LIVE_DATA`，
      # 而整条链从来没设过这个变量 ⇒ 它一次也没跑过，`node --test` 仍然 rc=0（10-18 在本机 WSL 也复现：
      # 互操 node.exe 收不到 Linux env ⇒ skipped=1 而 rc=0）。所以断言必须看 `skipped 0`，不看 rc。
      - name: 线上验收必须真跑（取发布面 + skipped 必须为 0）
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # 取的是**已发布面**（不是本地候选、更不是某天的冻结快照）：读 $PAGE_URL 的 manifest，
          # 按 `latestJsonChunks` 的分片清单拼出行数组。任何一片取不到就退出非 0 ——
          # 拿缺片面出结论比不结论更坏（10-17 的 CDN 抖动就这么把三分之一个面当成过全部）。
          PAGE_URL="$PAGE_URL" python3 - <<'PY'
          import json, os, sys, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          def get(p):
              req = urllib.request.Request(base + p, headers={"User-Agent": "Mozilla/5.0 ci-acceptance"})
              return json.loads(urllib.request.urlopen(req, timeout=90).read().decode("utf-8", "replace"))
          man = get("/data/manifest.json")
          files = man.get("files") or {}
          chunks = files.get("latestJsonChunks") or []
          if not chunks and files.get("latestJson"):
              # 单文件发布面也是合法的一格：验收只要求取到**全量** face。
              # 不往 manifest 里加 latestJsonChunks —— 前端 app.js 见到这个键就强制走
              # 分片加载器并校验 sha256/rowCount/size，单 path 会让浏览器取数面断
              # （10-21 step 家族评审点名 docs/app.js:185-195）。
              chunks = [{"path": files["latestJson"]}]
          if not chunks:
              print("❌ manifest 里没有 latestJsonChunks/latestJson ⇒ 取数面不可用", file=sys.stderr)
              raise SystemExit(3)
          rows, bad = [], []
          for c in chunks:
              path = "/" + str(c.get("path") or "").lstrip("/")
              try:
                  d = get(path)
              except Exception as exc:
                  bad.append("%s: %r" % (path, exc))
                  continue
              part = d.get("rows") if isinstance(d, dict) else d
              rows.extend([r for r in (part or []) if isinstance(r, dict)])
          if bad:
              print("❌ 有分片取不到，不许拿缺片面出结论：%s" % "; ".join(bad[:4]), file=sys.stderr)
              raise SystemExit(3)
          print("已发布面行数=%d ｜ 分片=%d ｜ manifest.updatedAt=%s"
                % (len(rows), len(chunks), man.get("updatedAt")))
          json.dump(rows, open("/tmp/live-latest.json", "w", encoding="utf-8"), ensure_ascii=False)
          # 展示层是 filtered 面，不是 latest：74782 这类"同车款ID 同名两行"只在 filtered 出现
          # （10-21 run #9 实证）。只验 latest 会让链绿而展示层红 ⇒ 同一条验收也要吃一遍 filtered。
          fj = str(files.get("filteredJson") or "").strip()
          if not fj:
              print("❌ manifest 里没有 filteredJson ⇒ 展示层取数面不可用", file=sys.stderr)
              raise SystemExit(3)
          frows = get("/" + fj.lstrip("/"))
          if not isinstance(frows, list):
              print("❌ filteredJson 不是数组", file=sys.stderr)
              raise SystemExit(3)
          print("展示层行数=%d" % len(frows))
          json.dump(frows, open("/tmp/live-filtered.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          set +e
          CARS_LIVE_DATA=/tmp/live-latest.json node --test tests/pages_ui.test.js > live-acceptance.log 2>&1
          ARC=$?
          set -e
          grep -aE "^ *(tests|pass|fail|skipped) [0-9]+" live-acceptance.log | tail -6 || true
          SKIP=$(grep -aoE "skipped [0-9]+" live-acceptance.log | tail -1 | tr -dc '0-9')
          echo "线上验收 rc=$ARC ｜ skipped=${SKIP:-读不到}"
          if [ "${SKIP:-x}" != "0" ]; then
            echo "❌ skipped≠0 ⇒ 那条线上验收根本没跑（环境变量没传到），不能算通过"
            exit 4
          fi
          if [ "$ARC" != "0" ]; then
            echo "❌ 线上验收判红 ⇒ 发布出去的 pages 数据不符合预期（原文见 live-acceptance.log）"
            tail -40 live-acceptance.log
            exit 1
          fi
          echo "✅ 线上验收真跑且通过（取的是本轮发布面）"
          set +e
          CARS_LIVE_DATA=/tmp/live-filtered.json node --test tests/pages_ui.test.js > live-acceptance-filtered.log 2>&1
          FARC=$?
          set -e
          grep -aE "^ *(tests|pass|fail|skipped) [0-9]+" live-acceptance-filtered.log | tail -6 || true
          FSKIP=$(grep -aoE "skipped [0-9]+" live-acceptance-filtered.log | tail -1 | tr -dc '0-9')
          echo "展示层验收 rc=$FARC ｜ skipped=${FSKIP:-读不到}"
          if [ "${FSKIP:-x}" != "0" ]; then
            echo "❌ 展示层验收 skipped≠0 ⇒ 那条没真跑"
            exit 4
          fi
          if [ "$FARC" != "0" ]; then
            echo "❌ 展示层（filtered）验收判红 ⇒ 发布出去的展示面不符合预期（原文见 live-acceptance-filtered.log）"
            tail -40 live-acceptance-filtered.log
            exit 1
          fi
          echo "✅ 展示层（filtered）验收真跑且通过"

      - name: 上传数据产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remerged-data-${{ steps.remerge.outputs.date }}-${{ github.run_id }}
          path: |
            out/merged_${{ steps.remerge.outputs.date }}.json
            out/merged_${{ steps.remerge.outputs.date }}.csv
            out/filtered_cars_${{ steps.remerge.outputs.date }}.json
            out/filtered_cars_${{ steps.remerge.outputs.date }}.csv
            remerge-stats.json
            postprocess-regressions.xml
            pages-audit-report.json
            pages-filtered-audit-report.json
            source-identity-latest.json
            source-identity-filtered.json
            config/source_identity_evidence.json
            column-scan-report.json
            column-scan-history.json
            live-acceptance.log
            live-acceptance-filtered.log
            site/data/manifest.json
          retention-days: 3

      # tag 以 cnb-data- 开头 ⇒ deploy-frontend.yml 会按规矩跳过，不会用旧站点覆盖本次部署
      - name: 创建数据发布
        env:
          DATE: ${{ steps.remerge.outputs.date }}
        run: |
          set -euo pipefail
          TAG="cnb-data-${DATE}-remerged-r${{ github.run_id }}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "重合并数据 ${DATE}（去重后）" \
            --notes "由 重合并并发布 工作流 r${{ github.run_id }} 生成：用修好的 SKU 归并逻辑重跑上一轮合并产物，不重新爬取。" \
            "out/merged_${DATE}.json" \
            "out/merged_${DATE}.csv" \
            "out/filtered_cars_${DATE}.json" \
            "out/filtered_cars_${DATE}.csv"

      # 同一份 site/ 也打成 verified 资产挂到本轮 release。为什么：deploy-frontend.yml（docs/** 推送
      # 就触发）用 download_verified_release.py 选「最新 **complete** 的 cnb-data-* release」，
      # complete = assets ⊇ {manifest.json, verified-site.zip}；本链的 release 此前只有 4 个 CSV/JSON
      # ⇒ 它永远选到**旧的 CNB clean release**（10-15 面），把重合并面翻回旧面（10-21 #25/#26 实测两次）。
      # 挂上这两个资产后，任何前端推送重发的都是**同一个重合并面**，不再互相覆盖。
      - name: 发布 verified 资产 release（draft→上传→发布；不可变发布不许事后补资产）
        env:
          DATE: ${{ steps.remerge.outputs.date }}
        run: |
          set -euo pipefail
          # 仓库开了 immutable releases：release 一旦 draft=false 就不能再上传资产
          # （真机 run 39609358770：HTTP 422 Cannot upload assets to an immutable release）。
          # 所以另发一条 **-remerged-verified-** release，走仓里既有的
          # publish_github_release.py 的 draft→全资产上传→PATCH 发布 流程；
          # tag 带 `-remerged-` ⇒ 本链输入选择器仍排除它（不自喂食），deploy-frontend 的
          # complete_release 会选中它（含 manifest.json + verified-site.zip）→ 前端推送重发同一面。
          # tag 带 run_attempt：同一 run 重跑时会拿到新 tag，不会撞上上次残留的 draft（publish() 拒绝已存在 tag）。
          TAG="cnb-data-${DATE}-remerged-verified-r${{ github.run_id }}a${{ github.run_attempt }}"
          python scripts/publish_github_release.py --site-dir site --repo "$GITHUB_REPOSITORY" --tag "$TAG" --ref "$GITHUB_SHA"
          echo "✅ verified 面已发布 $TAG"
