name: 部署前端展示

# 独立的前端部署路径：仅当 docs/**（前端页面/脚本/样式）或 config/filter_conditions.json
# 变更时触发。与 merge-and-filter.yml（爬虫+merge 数据部署链）完全解耦：
#   - 与 cnb-pages 共用 pages concurrency，串行发布避免相互覆盖
#   - 不跑 merge-data / create-release / 数据审计，不被爬取或 merge 状态阻塞
#   - 数据取最新完整 cnb-data-* 的已验证站点；数据缺失时拒绝发布。
# 适用于纯前端展示改动；涉及数据/爬虫/merge 逻辑的改动仍走 merge-and-filter.yml。

on:
  release:
    types: [published]

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'config/filter_conditions.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: ${{ github.event_name != 'release' || (github.event.release.tag_name != 'data-latest' && !startsWith(github.event.release.tag_name, 'cnb-data-')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 设置 Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: 准备静态站点
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf site release-files
          python scripts/download_verified_release.py --repo "$GITHUB_REPOSITORY" --dir release-files
          python scripts/prepare_cnb_pages.py --archive release-files/verified-site.zip --manifest release-files/manifest.json --site site
          python - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path("docs").rglob("*"):
              relative = source.relative_to("docs")
              if relative.parts[0] == "data" or relative.as_posix() == "manifest.json":
                  continue
              if source.is_file():
                  target = Path("site") / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          target_config = Path("site/config/filter_conditions.json")
          target_config.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile("config/filter_conditions.json", target_config)
          PY
          cmp release-files/manifest.json site/data/manifest.json

      - name: 验证渲染数据（解析前端JS逻辑）
        run: |
          test -s site/data/latest.json
          node scripts/verify_pages_rendered_data.js site/data/latest.json

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 校验线上数据清单
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/prepare_cnb_pages.py --site site --verify-url "$PAGE_URL"
