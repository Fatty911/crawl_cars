name: 部署车型配置网页

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - config/filter_conditions.json
      - scripts/prepare_pages_payload.py
      - scripts/publish_identity.py
      - scripts/verify_publish_superset.py
      - scripts/audit_pages_payload.py
      - scripts/prepare_debug_merge_inputs.py
      - scripts/preserve_publish_baseline.py
      - scripts/filter_pages_source_baseline.py
      - scripts/download_latest_crawler_artifact.py
      - scripts/analysis/merge_evidence_report.py
      - scripts/crawl_zero_to_whole_ratio.py
      - scripts/merge_data.py
      - scripts/test_autohome.py
      - scripts/crawl_dongchedi.py
      - scripts/crawl_yiche.py
      - .github/workflows/merge-and-filter.yml
      - .github/workflows/crawl-autohome.yml
      - .github/workflows/crawl-dongchedi.yml
      - .github/workflows/crawl-yiche.yml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '触发来源'
        required: false
        default: 'manual'
      trigger_time:
        description: '触发时间戳'
        required: false
        default: ''
      release_tag:
        description: '精确部署的 Release tag；留空时保持自动选择兼容行为'
        required: false
        default: ''
      debug_mode:
        description: '部署前执行 debug 防缩小校验'
        required: false
        default: 'false'
      mode:
        description: '部署与单源审计模式'
        required: false
        type: choice
        options:
          - deploy_and_audit
          - deploy_only
          - audit_only
        default: deploy_and_audit

permissions: {}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'audit_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 设置 Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: 准备静态站点
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf site release-files
          mkdir -p site/data site/config
          cp -R docs/. site/
          cp config/filter_conditions.json site/config/filter_conditions.json

          FOUND_DATA=false
          if [ -n "$RELEASE_TAG" ]; then
            TAGS=("$RELEASE_TAG")
          else
            mapfile -t TAGS < <(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName --jq '.[].tagName')
          fi

          for TAG in "${TAGS[@]}"; do
            rm -rf release-files
            mkdir -p release-files
            if ! gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir release-files \
              --pattern 'merged_*.json' \
              --pattern 'filtered_cars_*.json' \
              --pattern 'merged_*.csv' \
              --pattern 'filtered_cars_*.csv'; then
              if [ -n "$RELEASE_TAG" ]; then
                echo "指定 Release $TAG 下载失败"
                exit 1
              fi
              continue
            fi

            mapfile -t MERGED_JSON_FILES < <(find release-files -maxdepth 1 -type f -name 'merged_*.json' -print)
            mapfile -t FILTERED_JSON_FILES < <(find release-files -maxdepth 1 -type f -name 'filtered_cars_*.json' -print)
            mapfile -t MERGED_CSV_FILES < <(find release-files -maxdepth 1 -type f -name 'merged_*.csv' -print)
            mapfile -t FILTERED_CSV_FILES < <(find release-files -maxdepth 1 -type f -name 'filtered_cars_*.csv' -print)
            if [ "${#MERGED_JSON_FILES[@]}" -ne 1 ] || [ "${#FILTERED_JSON_FILES[@]}" -ne 1 ] || \
               [ "${#MERGED_CSV_FILES[@]}" -ne 1 ] || [ "${#FILTERED_CSV_FILES[@]}" -ne 1 ]; then
              if [ -n "$RELEASE_TAG" ]; then
                echo "指定 Release $TAG 的数据资产不完整或不唯一"
                exit 1
              fi
              continue
            fi
            MERGED_JSON="${MERGED_JSON_FILES[0]}"

            ROWS=$(python - "$MERGED_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              print(len(json.load(f)))
          PY
          )

            if [ "$ROWS" -lt 50 ]; then
              echo "警告：$TAG 的 merged 数据只有 $ROWS 行"
            fi

            curl --fail --show-error --silent --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 \
              https://cars.jiucai.eu.org/data/latest.json \
              --output /tmp/current-pages-latest.json
            python scripts/verify_publish_superset.py \
              --baseline /tmp/current-pages-latest.json \
              --candidate "$MERGED_JSON"

            DATE=$(basename "$MERGED_JSON" | sed -E 's/merged_([0-9]+)\.json/\1/')
            cp "$MERGED_JSON" site/data/latest.json
            cp "${FILTERED_JSON_FILES[0]}" site/data/filtered.json
            python scripts/prepare_pages_payload.py \
              --input site/data/latest.json \
              --output site/data/latest.json \
              --min-year 2022
            python scripts/prepare_pages_payload.py \
              --input site/data/filtered.json \
              --output site/data/filtered.json \
              --min-year 2022
            python scripts/audit_pages_payload.py \
              --baseline /tmp/current-pages-latest.json \
              --candidate site/data/latest.json \
              --report pages-audit-report.json \
              --head-sha "$GITHUB_SHA"
            cp "${MERGED_CSV_FILES[0]}" "site/data/merged_${DATE}.csv"
            cp "${FILTERED_CSV_FILES[0]}" "site/data/filtered_cars_${DATE}.csv"

            python - "$DATE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          date = sys.argv[1]
          with open("site/data/latest.json", encoding="utf-8") as f:
              latest = json.load(f)
          with open("site/data/filtered.json", encoding="utf-8") as f:
              filtered = json.load(f)

          manifest = {
              "date": date,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "rowCount": len(latest),
              "filteredRowCount": len(filtered),
              "files": {
                  "latestJson": "data/latest.json",
                  "filteredJson": "data/filtered.json",
                  "latestCsv": f"data/merged_{date}.csv",
                  "filteredCsv": f"data/filtered_cars_{date}.csv",
              },
          }
          with open("site/data/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

            FOUND_DATA=true
            echo "使用 $TAG 发布网页数据：$ROWS 行"
            break
          done

          if [ "$FOUND_DATA" != "true" ]; then
            echo "未找到可用 Release 数据，仅发布网页外壳"
          fi

          touch site/.nojekyll

      - name: 上传 Pages 发布审计证据
        if: ${{ always() && hashFiles('pages-audit-report.json') != '' }}
        uses: actions/upload-artifact@main
        with:
          name: pages-audit-report
          path: |
            pages-audit-report.json
            /tmp/current-pages-latest.json
          if-no-files-found: error
          retention-days: 3

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  audit:
    name: Single-source audit
    needs: deploy
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy_only') &&
      (
        needs.deploy.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_only')
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch latest.json from Pages
        run: |
          REPO=$(echo ${{ github.repository }} | sed 's|.*/||')
          case "$REPO" in
            crawl_cars) PAGES_URL="https://cars.jiucai.eu.org/data/latest.json" ;;
            crawl_phones) PAGES_URL="https://phones.jiucai.eu.org/data/latest.json" ;;
            crawl_laptops) PAGES_URL="https://nbs.jiucai.eu.org/data/latest.json" ;;
            *) echo "Unknown repo"; exit 0 ;;
          esac
          echo "PAGES_URL=$PAGES_URL"
          mkdir -p ./data
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 "$PAGES_URL" -o ./data/latest.json || echo "FETCH_FAILED"

      - name: Analyze single-source data
        run: |
          python3 scripts/analyze_single_source.py --data ./data/latest.json --output ./audit_report.json
          cat ./audit_report.json | head -50

      - name: Call AA 50+ LLM for root cause analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          python3 scripts/llm_single_source_audit.py --data ./data/latest.json --report ./audit_report.json --output ./llm_analysis.md
          echo "=== LLM Analysis ==="
          head -80 ./llm_analysis.md || true

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./audit_report.json', 'utf8');
            const analysis = fs.existsSync('./llm_analysis.md') ? fs.readFileSync('./llm_analysis.md', 'utf8') : 'No LLM analysis available';
            const reportData = JSON.parse(report);
            const title = `Single-source audit: ${reportData.single_rate}% single (${reportData.single_count}/${reportData.total})`;
            const body = `## Single Source Audit Report

            **Generated:** ${new Date().toISOString()}
            **Total rows:** ${reportData.total}
            **Multi-source:** ${reportData.multi_count} (${reportData.multi_rate}%)
            **Single-source:** ${reportData.single_count} (${reportData.single_rate}%)

            ### Root Causes

            ${JSON.stringify(reportData.causes, null, 2)}

            ### LLM Analysis (AA 50+ model)

            ${analysis}

            ### Source Distribution

            ${JSON.stringify(reportData.source_distribution, null, 2)}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'single-source-audit'
            });

            const existing = issues.data.find(i => i.title.startsWith('Single-source audit:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['single-source-audit', 'automated']
              });
              console.log('Created new issue');
            }
